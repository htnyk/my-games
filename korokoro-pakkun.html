<style>
/* Layout: one full-screen candy-sky canvas, floating pill toolbar on top, title/celebration cards as overlays */
:root{
  --sky:#ffd9ec;
  --ink:#5b3a63;
  --cream:#fffaf3;
  --berry:#ff6fa5;
  --berry-deep:#e8508a;
  --lemon:#ffd84d;
  --veil:rgba(255,236,246,.55);
  --font-pop:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#cv{display:block;width:100%;height:100%;touch-action:none}

.bar{position:absolute;top:10px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.bar .grp{display:flex;gap:8px;pointer-events:auto}
.btn{font-family:var(--font-pop);font-size:14px;color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:6px 12px 5px;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;gap:5px;cursor:pointer;line-height:1.1;white-space:nowrap}
.btn svg{width:17px;height:17px;flex:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px dashed var(--berry);outline-offset:3px}
.btn.flow{font-size:18px;padding:8px 18px 7px;background:var(--berry);color:#fff}
.btn.flow svg{width:20px;height:20px}
.btn.flow.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.btn.flow.pulse{animation:none}}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--veil);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:24px 20px 26px;width:100%;max-width:340px;text-align:center;display:grid;gap:14px;justify-items:center}
.logo{font-family:var(--font-pop);font-size:clamp(34px,11vw,46px);line-height:1.15;letter-spacing:.02em;text-wrap:balance;margin:0}
.logo span{display:inline-block;color:var(--c);text-shadow:
  3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),
  2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 6px 0 var(--ink);
  animation:hop 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * .08s)}
@keyframes hop{0%,70%,100%{transform:translateY(0)}35%{transform:translateY(-6px)}}
.sub{font-weight:800;font-size:15px;line-height:1.7;margin:0;max-width:26ch}
.btn.big{font-size:22px;padding:12px 34px 10px;background:var(--berry);color:#fff;box-shadow:0 6px 0 var(--ink)}
.btn.big:active{box-shadow:0 2px 0 var(--ink);transform:translateY(4px)}
.done-title{font-family:var(--font-pop);font-size:clamp(24px,7.5vw,30px);line-height:1.35;margin:0;color:var(--berry-deep);text-wrap:balance}
.pill{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-family:var(--font-pop);font-size:13px;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:4px 12px 3px;white-space:nowrap;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.pill:active{transform:translateX(-50%) translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pill:focus-visible{outline:3px dashed var(--berry);outline-offset:3px}
.sel-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.sbtn{font-family:var(--font-pop);font-size:16px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;aspect-ratio:1;max-width:100%;box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.sbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.sbtn.now{background:var(--berry);color:#fff}
.sbtn:focus-visible{outline:3px dashed var(--berry);outline-offset:2px}
.linkbtn{font-family:var(--font-pop);font-size:14px;color:var(--ink);background:none;border:0;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:4px}
.pill .inks{display:flex;gap:4px;align-items:center}
.pill .ink-lbl{margin-right:2px}
.pill .ink{display:block;width:18px;height:8px;border-radius:4px;background:#ece2f1;border:2px solid var(--ink)}
.pill .ink.on{background:var(--berry)}
.pill.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 7px))}40%{transform:translateX(calc(-50% + 7px))}60%{transform:translateX(calc(-50% - 4px))}80%{transform:translateX(calc(-50% + 4px))}}
.clear-lbl{font-family:var(--font-pop);font-size:18px;margin:0}
.stars{display:flex;gap:6px}
.stars svg{width:48px;height:48px;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;fill:#ece2f1}
.stars svg.on{fill:var(--lemon);animation:starpop .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.hint-sm{font-weight:800;font-size:13px;margin:0}
.btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion: reduce){.stars svg.on,.pill.shake{animation:none}}
@media (prefers-reduced-motion: reduce){.logo span{animation:none}}

<div id="app">

        <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.5L12 17.3 6.1 20.5l1.3-6.5L2.5 9.4l6.6-.8z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.5L12 17.3 6.1 20.5l1.3-6.5L2.5 9.4l6.6-.8z"/></svg>
      </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
const { Engine, Bodies, Composite, Body, Events, Constraint } = Matter;
const TAU = Math.PI * 2, INK = '#5b3a63';
// each color is a fruit or vegetable: apple, tomato, mikan, lemon, muscat grape, blueberry
const BALL_COLS = ['#ff4f6d', '#ff6a3d', '#ffa62e', '#ffd84d', '#8fdc6a', '#6f8ff0'];
const FRUIT_NAMES = ['りんご', 'トマト', 'みかん', 'レモン', 'マスカット', 'ブルーベリー'];
const LINE_COLS = ['#ff9cc8', '#8fdcff', '#ffe27a', '#a6f0c9', '#cdb0ff'];
const NOTES = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
const KIND = {
  frog:  { body: '#93e3b4', inner: '#ffffff' },
  bear:  { body: '#f3bb84', inner: '#ffd3dc' },
  hippo: { body: '#c8b4f6', inner: '#ffd3e6' },
  pig:   { body: '#ffbcd0', inner: '#ff94b5' },
  panda: { body: '#ffffff', inner: '#3d3346' },
  cat:   { body: '#ffd59a', inner: '#ffb3c7' },
  rabbit:{ body: '#f6f1ff', inner: '#ffc4dc' }
};
const EAT_WORDS = ['もぐ', 'ぱくっ', 'おいしい！', 'もぐもぐ', 'あーん'];
const NEED = 20, T = 11, PT = 16, MAX_LINES = 14, BURST = 30;

const app = document.getElementById('app');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

let W, H, DPR, R, floorY, engine, world, bgCanvas;
let balls = [], lines = [], animals = [], particles = [], floaters = [], eatQueue = [];
let drawing = null, lineColIdx = 0;
let flowLeft = 0, playing = false, spawnT = 0, totalEaten = 0, kindBag = [];
let allFullT = 0, doneShown = false;
const disp = { x: 0, y: 0, puff: 0 };

const rand = (a, b) => a + Math.random() * (b - a);
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const POP = '"Mochiy Pop One","M PLUS Rounded 1c",sans-serif';

/* ---------- sound ---------- */
let AC = null, master = null, pingBudget = 0;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(freq, dur, vol, type = 'sine', when = 0, slideTo = 0) {
  if (!AC) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur * 0.8);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function ping(col) {
  if (pingBudget <= 0) return; pingBudget--;
  tone(NOTES[col], 0.45, 0.11); tone(NOTES[col] * 3.98, 0.12, 0.025);
}
function chomp() { tone(620, 0.12, 0.16, 'triangle', 0, 220); tone(880, 0.1, 0.06, 'sine', 0.07); }
function whoosh() {
  if (!AC) return;
  const len = Math.floor(AC.sampleRate * 1.1), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.9;
  const g = AC.createGain(), t = AC.currentTime;
  f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(2200, t + 0.3); f.frequency.exponentialRampToValueAtTime(800, t + 1.1);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  src.connect(f); f.connect(g); g.connect(master); src.start(t);
}
function fanfare(big) {
  const seq = big ? [523.25, 659.25, 783.99, 1046.5, 1318.5] : [659.25, 783.99, 1046.5];
  seq.forEach((f, i) => { tone(f, 0.35, 0.13, 'triangle', i * 0.11); tone(f * 2, 0.2, 0.03, 'sine', i * 0.11); });
}

/* ---------- canvas helpers ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 0.9, y - s * 0.25, x - s * 0.45, y - s * 0.95, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 0.95, x + s * 0.9, y - s * 0.25, x, y + s * 0.35);
  ctx.closePath();
}
function star(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2, rr2 = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
  }
  ctx.closePath();
}

/* ---------- background ---------- */
function makeBg() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W * DPR; bgCanvas.height = H * DPR;
  const b = bgCanvas.getContext('2d'); b.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#ffd3ea'); g.addColorStop(0.55, '#f1dcff'); g.addColorStop(1, '#d4ecff');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // faint rainbow
  const cx = W * 0.5, cy = H * 0.78, base = Math.max(W, H) * 0.62;
  ['#ff9cc8', '#ffd27a', '#fff09a', '#a6f0c9', '#8fdcff', '#cdb0ff'].forEach((c, i) => {
    b.beginPath(); b.arc(cx, cy, base - i * 14, Math.PI, TAU);
    b.strokeStyle = c; b.globalAlpha = 0.28; b.lineWidth = 14; b.stroke();
  });
  b.globalAlpha = 1;
  // polka dots
  b.fillStyle = 'rgba(255,255,255,.45)';
  const step = 46;
  for (let y = 20, row = 0; y < floorY - 10; y += step, row++) {
    for (let x = (row % 2 ? step / 2 : 0) + 10; x < W; x += step) { b.beginPath(); b.arc(x, y, 4, 0, TAU); b.fill(); }
  }
  // sparkles
  for (let i = 0; i < 14; i++) {
    const x = rand(10, W - 10), y = rand(60, floorY - 120), r = rand(4, 8);
    b.fillStyle = 'rgba(255,255,255,.85)';
    b.beginPath(); b.moveTo(x, y - r); b.quadraticCurveTo(x, y, x + r, y); b.quadraticCurveTo(x, y, x, y + r);
    b.quadraticCurveTo(x, y, x - r, y); b.quadraticCurveTo(x, y, x, y - r); b.fill();
  }
  // candy floor
  b.fillStyle = '#ffb3d0'; b.fillRect(0, floorY, W, H - floorY);
  b.save(); b.beginPath(); b.rect(0, floorY, W, H - floorY); b.clip();
  b.strokeStyle = 'rgba(255,255,255,.6)'; b.lineWidth = 9;
  for (let x = -H; x < W + H; x += 26) { b.beginPath(); b.moveTo(x, H); b.lineTo(x + (H - floorY) + 10, floorY - 10); b.stroke(); }
  b.restore();
  // frosting scallops
  const sr = 13;
  b.fillStyle = '#fff6fa'; b.strokeStyle = INK; b.lineWidth = 3;
  b.beginPath(); b.moveTo(0, floorY + 6);
  for (let x = 0; x <= W + sr * 2; x += sr * 2) b.arc(x + sr, floorY + 4, sr, Math.PI, 0, true);
  b.lineTo(W + 40, floorY - 20); b.lineTo(-10, floorY - 20); b.closePath();
  b.save(); b.clip();
  b.restore();
  b.beginPath();
  for (let x = 0; x <= W + sr * 2; x += sr * 2) { b.moveTo(x, floorY); b.arc(x + sr, floorY, sr, Math.PI, 0, true); }
  b.fillStyle = '#fff6fa'; b.fill();
  b.beginPath();
  for (let x = 0; x <= W + sr * 2; x += sr * 2) { b.moveTo(x, floorY); b.arc(x + sr, floorY, sr, Math.PI, 0, true); }
  b.stroke();
  b.beginPath(); b.moveTo(0, floorY); b.lineTo(W, floorY); b.stroke();
}

/* ---------- world ---------- */
function setup() {
  W = app.clientWidth; H = app.clientHeight; DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  R = Math.max(9, Math.min(14, W * 0.026));
  floorY = H - 30;
  engine = Engine.create(); engine.gravity.y = 0.9; world = engine.world;
  Events.on(engine, 'collisionStart', onCollide);
  const wo = { isStatic: true, friction: 0.05, label: 'wall' };
  Composite.add(world, [
    Bodies.rectangle(W / 2, floorY + 50, W * 3, 100, wo),
    Bodies.rectangle(-25, H / 2, 50, H * 3, wo),
    Bodies.rectangle(W + 25, H / 2, 50, H * 3, wo)
  ]);
  balls = []; lines = []; animals = []; obst = []; particles = []; floaters = []; eatQueue = [];
  makeBg();
  if (!cur) cur = pickStage(stage);
  buildStage(makeSpec(cur));
}

function addLid(a) {
  const lid = Bodies.rectangle(a.x, a.mouth.cy - a.mouth.h * 0.08, a.mouth.w * 0.98, 12, { isStatic: true, label: 'animal', chamfer: { radius: 5 } });
  a.bodies.push(lid); Composite.add(world, lid); return lid;
}
function makeAnimal(kind, x, baseY, aw, platform, need, sleep) {
  const ah = aw * 0.95;
  const a = { kind, x, baseY, aw, ah, platform, eaten: 0, full: false, open: 1, openV: 0, squish: 0, happy: 0, bubble: 0, bodies: [] };
  a.mouth = { cy: baseY - ah * 0.68, w: aw * 0.74, h: ah * 0.32 };
  const st = { isStatic: true, friction: 0.05, restitution: 0.25, label: 'animal' };
  const blockTop = a.mouth.cy + ah * 0.06;
  a.bodies.push(Bodies.rectangle(x, (blockTop + baseY) / 2, aw * 0.9, baseY - blockTop, st));
  const wallTop = baseY - ah * 0.85 + aw * 0.04, ww = aw * 0.14;
  for (const s of [-1, 1]) {
    a.bodies.push(Bodies.rectangle(x + s * (aw / 2 - ww / 2), (wallTop + baseY) / 2, ww, baseY - wallTop,
      Object.assign({ chamfer: { radius: [ww * 0.48, ww * 0.48, 0, 0] } }, st)));
  }
  const sensor = Bodies.rectangle(x, a.mouth.cy, a.mouth.w * 0.8, a.mouth.h * 0.55, { isStatic: true, isSensor: true, label: 'mouth' });
  sensor.animal = a; a.bodies.push(sensor);
  if (platform) a.bodies.push(Bodies.rectangle(x, baseY + 9, aw * 1.15, 18, { isStatic: true, label: 'animal', chamfer: { radius: 8 } }));
  Composite.add(world, a.bodies);
  a.need = need || NEED; a.sleep = !!sleep;
  if (a.sleep) a.sleepLid = addLid(a);
  return a;
}

/* ---------- stages ---------- */
const CLOUD_Y = 145, GACC = 0.25;
// the cloud sits a little higher than the layout reference so its nozzle ends where fruit used to appear
const cloudS = () => Math.min(88, W * 0.22);
const spoutY = () => disp.y + cloudS() * 0.82 + 8;
// mirrors Matter's integration (air drag 0.996/step, gravity 0.25/step²) so launches can be aimed
function simPath(vx, vy, x, y, yCross) {
  const pts = [];
  for (let i = 0; i < 500; i++) { vx *= 0.996; vy = vy * 0.996 + GACC; x += vx; y += vy; pts.push([x, y]); if (vy > 0 && y >= yCross) break; }
  return pts;
}
function ghost(b, sec) { b.collisionFilter.category = 0x0004; b.collisionFilter.mask = 0xFFFFFFFF & ~0x0006; b.ghostT = sec; }
function geo() {
  const aw = Math.min(W * 0.44, 200, H * 0.27);
  const Y = f => CLOUD_Y + (floorY - CLOUD_Y) * f;
  const floorAnimal = w => ({ x: W - w / 2 - 16, baseY: floorY, aw: w });
  const plat = (w, f) => ({ x: W - w * 0.62 - 16, baseY: Y(f), aw: w, platform: true });
  const mouthY = an => an.baseY - an.aw * 0.95 * 0.68;
  const headTop = an => an.baseY - an.aw * 0.95 * 0.85;
  const gapMid = (cx, an) => (cx + an.x - an.aw / 2) / 2;
  const spikeR = Math.max(22, Math.min(32, W * 0.065));
  const spike = (x, y) => ({ type: 'spike', x, y, r: spikeR });
  const floorSpike = x => ({ type: 'spike', x, y: floorY - spikeR * 0.75, r: spikeR });
  const mover = (w, cx) => {
    const xmax = W - 16 - w / 2, xmin = Math.min(xmax, cx + 95 + w / 2);
    return { x: (xmin + xmax) / 2, baseY: floorY, aw: w, move: { amp: Math.min((xmax - xmin) / 2, W * 0.2), speed: 0.9 } };
  };
  const wall = (x, top, bottom = floorY) => ({ type: 'block', x, y: (top + bottom) / 2, w: Math.max(24, W * 0.06), h: bottom - top, angle: 0 });
  const shelf = (x0, x1, y) => ({ type: 'block', x: (x0 + x1) / 2, y, w: x1 - x0, h: 18, angle: 0 });
  const sim = simPath;
  const aimTramp = (tx, ty, an, w) => {
    const my = mouthY(an) - 6, ht = headTop(an), gx = an.x;
    let best = null;
    for (let ay = ht - 70; ay > CLOUD_Y; ay -= 20) {
      let lo = 1, hi = 40;
      for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; const apex = Math.min(...sim(0, -m, 0, ty, 1e9).slice(0, 300).map(q => q[1])); if (apex > ay) lo = m; else hi = m; }
      const vy = (lo + hi) / 2;
      let a = 0, b = 20;
      for (let k = 0; k < 30; k++) { const m = (a + b) / 2; const pts = sim(m, -vy, tx, ty, my); if (pts[pts.length - 1][0] < gx) a = m; else b = m; }
      const vx = (a + b) / 2, pts = sim(vx, -vy, tx, ty, my);
      best = { vx, vy };
      if (pts.every(([x, y]) => x < gx - an.aw * 0.6 || x > gx - an.aw * 0.25 || y < ht - 16)) break;
    }
    return { type: 'tramp', x: tx, y: ty, w, angle: Math.atan2(best.vx, best.vy), power: Math.hypot(best.vx, best.vy), stand: true };
  };
  // animal shut in a box: a wall on the cloud side and a roof
  const box = (an, roofY) => {
    const wx = an.x - an.aw / 2 - 18;
    return { wx, parts: [wall(wx, roofY), shelf(wx - 12, W + 12, roofY)] };
  };
  // same, but the roof has a hole above the mouth with a bag hanging in it
  const bagBox = (an, roofY, bw, bh, cap) => {
    const wx = an.x - an.aw / 2 - 18, hole = bw + 24;
    return { wx, parts: [wall(wx, roofY), shelf(wx - 12, an.x - hole / 2, roofY), shelf(an.x + hole / 2, W + 12, roofY),
      { type: 'bag', x: an.x, y: roofY - 9, w: bw, h: bh, cap }] };
  };
  const warpBox = () => {
    const an = floorAnimal(aw), cx = W * 0.24, top = Y(0.22), b = box(an, top);
    return { cloud: cx, animals: [an], obst: [...b.parts,
      { type: 'warp', x: Math.max(32, W * 0.08), y: Y(0.42), x2: an.x, y2: top + 46, r: 26 }] };
  };
  return { sim, aw, Y, floorAnimal, plat, mouthY, headTop, gapMid, spikeR, spike, floorSpike, mover, wall, shelf, aimTramp, box, bagBox, warpBox };
}

let stage = 1, cur = null, obst = [], lineLimit = 0, flushCount = 0, loopBag = [], fxQueue = [], curPar = 1;
let hint = { lines: [], a: 0, t: 0, sticky: false };

function pickStage(n) {
  let def;
  if (n <= STAGES.length) def = n - 1;
  else { if (!loopBag.length) loopBag = shuffle(STAGES.map((_, i) => i).slice(1)); def = loopBag.pop(); }
  if (kindBag.length < 2) kindBag = kindBag.concat(shuffle(Object.keys(KIND)));
  return { def, mir: n > 1 && Math.random() < 0.5, kinds: [kindBag.pop(), kindBag.pop()] };
}

function makeSpec(c) {
  const s = STAGES[c.def].make(geo());
  s.obst = s.obst || [];
  s.limit = STAGES[c.def].limit || 0;
  if (c.mir) {
    s.cloud = W - s.cloud;
    for (const an of s.animals) an.x = W - an.x;
    for (const o of s.obst) {
      for (const k of ['x', 'x2', 'tx']) if (o[k] != null) o[k] = W - o[k];
      for (const k of ['angle', 'speed', 'dir', 'dump']) if (o[k]) o[k] = -o[k];
    }
  }
  return s;
}

function clearWorld() {
  for (const b of balls) Composite.remove(world, b);
  for (const l of lines) Composite.remove(world, l.bodies);
  for (const a of animals) Composite.remove(world, a.bodies);
  for (const o of obst) { if (o.body) Composite.remove(world, o.body); if (o.cons) Composite.remove(world, o.cons); }
  balls = []; lines = []; animals = []; obst = []; eatQueue = []; fxQueue = []; floaters = [];
}

function makeObst(o) {
  o.squish = 0; o.wig = 0; o.rot = 0; o.pulse = 0; o.body = null;
  const st = { isStatic: true, friction: 0.02, restitution: 0.3 };
  if (o.type === 'block') {
    o.body = Bodies.rectangle(o.x, o.y, o.w, o.h, Object.assign({ angle: o.angle, label: 'obst', chamfer: { radius: Math.min(o.w, o.h) * 0.45 } }, st));
  } else if (o.type === 'spike') {
    o.body = Bodies.circle(o.x, o.y, o.r * 0.85, { isStatic: true, isSensor: true, label: 'spike' });
  } else if (o.type === 'bumper') {
    o.body = Bodies.circle(o.x, o.y, o.r, { isStatic: true, label: 'bumper', restitution: 1 });
  } else if (o.type === 'spin') {
    const th = 16;
    o.body = Body.create({ parts: [
      Bodies.rectangle(o.x, o.y, o.len * 2, th, { chamfer: { radius: th / 2 - 1 } }),
      Bodies.rectangle(o.x, o.y, th, o.len * 2, { chamfer: { radius: th / 2 - 1 } })], label: 'obst', friction: 0.02, restitution: 0.4 });
    Body.setStatic(o.body, true);
  } else if (o.type === 'tramp') {
    o.body = Bodies.rectangle(o.x, o.y, o.w, 14, Object.assign({ angle: o.angle, label: 'tramp', chamfer: { radius: 6 } }, st));
  } else if (o.type === 'warp') {
    o.body = Bodies.circle(o.x, o.y, o.r * 0.75, { isStatic: true, isSensor: true, label: 'warp' });
  } else if (o.type === 'fan') {
    o.r = 24; o.spin = 0;
    o.body = Bodies.circle(o.x, o.y, o.r, Object.assign({ label: 'obst' }, st));
  } else if (o.type === 'bell') {
    o.swing = 0;
    o.body = Bodies.circle(o.x, o.y, o.r, { isStatic: true, label: 'bell', restitution: 0.5 });
  } else if (o.type === 'button') {
    o.pressed = false;
    o.body = Bodies.rectangle(o.x, o.y, o.w, o.h, Object.assign({ label: 'button', chamfer: { radius: 6 } }, st));
  } else if (o.type === 'door') {
    o.opened = false; o.openT = 0;
    o.body = Bodies.rectangle(o.x, o.y, o.w, o.h, Object.assign({ label: 'obst', chamfer: { radius: 7 } }, st));
  } else if (o.type === 'seesaw') {
    o.body = Bodies.rectangle(o.x, o.y, o.len, 14, { angle: o.angle, density: 0.0015, friction: 0.05, restitution: 0.1, label: 'obst', chamfer: { radius: 6 } });
    o.cons = Constraint.create({ pointA: { x: o.x, y: o.y }, bodyB: o.body, pointB: { x: 0, y: 0 }, length: 0, stiffness: 1 });
    Composite.add(world, o.cons);
  } else if (o.type === 'elev') {
    const th = 12, sh = 46, wx = o.x - o.dump * (o.w / 2 - 5);
    o.railTop = Math.max(CLOUD_Y + 30, o.yTop - 60);
    o.body = Body.create({ parts: [
      Bodies.rectangle(o.x, o.yBot, o.w, th, { chamfer: { radius: 5 } }),
      Bodies.rectangle(wx, o.yBot - sh / 2 + th / 2, 10, sh, { chamfer: { radius: 4 } })], label: 'obst', friction: 0.05 });
    Body.setStatic(o.body, true);
    o.cur = o.yBot; o.t = 0; o.tossed = false;
    const sx = o.x + o.dump * o.w * 0.3, sy = o.yTop - 14, dx = Math.abs(o.tx - sx);
    let lo = 0, hi = 15;
    for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2, pts = simPath(m, -4, 0, sy, o.ty - 4); if (pts[pts.length - 1][0] < dx) lo = m; else hi = m; }
    o.toss = (lo + hi) / 2;
  } else if (o.type === 'bag') {
    const th = 12;
    o.n = 0; o.burst = false; o.burstT = 0; o.fill = 0;
    o.body = Body.create({ parts: [
      Bodies.rectangle(o.x - o.w / 2 - th / 2, o.y + o.h / 2, th, o.h + 4),
      Bodies.rectangle(o.x + o.w / 2 + th / 2, o.y + o.h / 2, th, o.h + 4),
      Bodies.rectangle(o.x, o.y + o.h + th / 2, o.w + th * 2, th, { chamfer: { radius: 5 } })], label: 'obst', friction: 0.05, restitution: 0.1 });

  const b = Bodies.circle(disp.x + rand(-5, 5), spoutY(), R, {
    restitution: 0.45, friction: 0.01, frictionStatic: 0, frictionAir: 0.004, density: 0.002, label: 'ball',

  ghost(b, 0.35);
  Object.assign(b, { col, stillT: 0, floorT: 0, fade: 1, fading: false, gone: false });
  Composite.add(world, b); balls.push(b);
  disp.puff = 1;
}

function onCollide(e) {
  for (const p of e.pairs) {
    const A = p.bodyA, B = p.bodyB;
    const ball = A.label === 'ball' ? A : (B.label === 'ball' ? B : null);
    if (!ball) continue;
    const other = ball === A ? B : A;
    if (other.label === 'mouth') { if (!other.animal.full && !other.animal.sleep) eatQueue.push([ball, other.animal]); }
    else if (FX_OF[other.label]) fxQueue.push([FX_OF[other.label], ball, other.obst]);
    else if ((other.label === 'line' || other.label === 'animal') && ball.speed > 1.4) ping(ball.col);
  }
}

function eat(ball, a) {
  ball.gone = true; Composite.remove(world, ball);
  a.eaten++; totalEaten++;
  a.open = 0.12; a.openV = 0; a.squish = 1; a.happy = 0.55;
  chomp();
  for (let i = 0; i < 7; i++) {
    particles.push({ x: a.x + rand(-10, 10), y: a.mouth.cy, vx: rand(-2.2, 2.2), vy: rand(-4.5, -2), life: 0, max: rand(0.6, 0.95),
      col: i % 2 ? BALL_COLS[ball.col] : '#ffffff', kind: i % 3 ? 'star' : 'heart', rot: rand(0, TAU), vr: rand(-6, 6), size: rand(5, 9) });
  }
  const word = Math.random() < 0.5 ? FRUIT_NAMES[ball.col] + '！' : EAT_WORDS[Math.floor(Math.random() * EAT_WORDS.length)];
  floaters.push({ x: Math.max(60, Math.min(W - 60, a.x)), y: a.mouth.cy - 20, text: word, life: 0, col: BALL_COLS[ball.col] });
  if (a.eaten >= a.need && !a.full) {
    a.full = true; a.bubble = 0.01;
    addLid(a);
    fanfare(false);
    for (let i = 0; i < 16; i++) particles.push({ x: a.x, y: a.mouth.cy, vx: rand(-4, 4), vy: rand(-6, -2), life: 0, max: rand(0.8, 1.3),

/* ---------- loop ---------- */
// fruit waiting inside a bag or riding the elevator must not fade away
function heldBall(b) {
  const p = b.position;
  for (const o of obst) {
    if (o.type === 'bag' && !o.burst && Math.abs(p.x - o.x) < o.w / 2 + 4 && p.y > o.y - R * 3 && p.y < o.y + o.h + 8) return true;
    if (o.type === 'elev' && Math.abs(p.x - o.body.position.x) < o.w * 0.8 && Math.abs(p.y - o.body.position.y) < 70) return true;
  }
  return false;
}
function update(dt, t) {
  pingBudget = Math.min(6, pingBudget + dt * 14);
  disp.puff = Math.max(0, disp.puff - dt * 5);
  const allFull = animals.length && animals.every(a => a.full);
  if (playing && flowLeft > 0) {
    spawnT += dt;
    while (spawnT > 0.06 && flowLeft > 0) { spawnT -= 0.06; flowLeft--; if (balls.length < 110) spawnBall(); }
  } else spawnT = 0;
  for (const b of balls) {
    if (b.gone) continue;
    if (b.warpCD) b.warpCD = Math.max(0, b.warpCD - dt);
    if (b.ghostT) { b.ghostT -= dt; if (b.ghostT <= 0) { b.ghostT = 0; b.collisionFilter.category = 0x0002; b.collisionFilter.mask = 0xFFFFFFFF; } }
    if (b.fading) { b.fade -= dt * 2.5; if (b.fade <= 0) { b.gone = true; Composite.remove(world, b); } continue; }
    const p = b.position;
    if (p.y > H + 60 || p.x < -60 || p.x > W + 60) { b.gone = true; Composite.remove(world, b); continue; }
    if (p.y > floorY - R * 2.2) b.floorT += dt;
    if (b.speed < 0.25) b.stillT += dt; else b.stillT = Math.max(0, b.stillT - dt * 0.5);
    if ((b.floorT > 2.5 || b.stillT > 1.8) && !heldBall(b)) b.fading = true;
  }
  balls = balls.filter(b => !b.gone);
  for (const a of animals) {
    let target = a.full ? 0.2 : a.sleep ? 0.05 : 1 + Math.sin(t * 2 + a.x) * 0.05;
    if (!a.full && !a.sleep) for (const b of balls) {
      const dx = Math.abs(b.position.x - a.x), dy = a.mouth.cy - b.position.y;
      if (dx < a.aw * 0.75 && dy > 0 && dy < 190) { target = 1.3; break; }
    }
    a.openV += (target - a.open) * 0.22; a.openV *= 0.72; a.open += a.openV;
    a.squish = Math.max(0, a.squish - dt * 4);
    a.happy = Math.max(0, a.happy - dt);
    if (a.full) a.bubble += dt;
  }
  for (const l of lines) l.pop = Math.max(0, l.pop - dt * 5);
  obstUpdate(dt);
  balls = balls.filter(b => !b.gone);
  for (const p of particles) { p.life += dt; p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.rot += p.vr * dt; }
  particles = particles.filter(p => p.life < p.max);
  for (const f of floaters) { f.life += dt; f.y -= 40 * dt; }
  floaters = floaters.filter(f => f.life < 0.9);
  if (playing && hint.a > 0) {
    hint.t += dt;
    const fade = hint.sticky ? flushCount > 0 : (hint.t > 4 || (hint.t > 1.2 && (lines.length || flushCount)));
    if (fade) hint.a = Math.max(0, hint.a - dt * 2);
  }
  if (allFull && !doneShown) {
    allFullT += dt;
    if (allFullT > 1.3) {
      doneShown = true;
      showDone();
      fanfare(true);
      for (let i = 0; i < 60; i++) particles.push({ x: rand(0, W), y: rand(-40, 0), vx: rand(-1, 1), vy: rand(1, 3), life: 0, max: rand(1.8, 3),
        col: BALL_COLS[i % 6], kind: i % 4 ? 'confetti' : 'star', rot: rand(0, TAU), vr: rand(-8, 8), size: rand(5, 9) });
    }
  }
}

function draw(t) {
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  const FRONT = { door: 1, jelly: 1, crow: 1 };
  for (const o of obst) if (!FRONT[o.type]) drawObst(o, t);
  for (const a of animals) drawAnimal(a, t);
  for (const o of obst) if (o.type === 'door') drawObst(o, t);
  for (const l of lines) drawLine(l.pts, l.col, l.pop);
  if (drawing && !drawing.stopped) drawLine(drawing.pts, drawing.col, 0);
  drawGuide(t);
  for (const b of balls) drawBall(b);
  for (const o of obst) if (o.type === 'jelly' || o.type === 'crow') drawObst(o, t);
  for (const o of obst) if (o.type === 'bag') drawBagTag(o, t);
  drawCloud(disp.x, disp.y + Math.sin(t * 2) * 2, cloudS(), t);
  for (const p of particles) {
    const al = 1 - p.life / p.max;
    ctx.save(); ctx.globalAlpha = Math.max(0, al); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.col; ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
    if (p.kind === 'heart') { heart(0, 0, p.size); ctx.fill(); ctx.stroke(); }
    else if (p.kind === 'star') { star(0, 0, p.size, 0); ctx.fill(); ctx.stroke(); }
    else if (p.kind === 'dot') { circ(0, 0, p.size * 0.5); ctx.fill(); }
    else { ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); }
    ctx.restore();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) {
    ctx.globalAlpha = 1 - f.life / 0.9;
    ctx.font = `18px ${POP}`; ctx.lineWidth = 5; ctx.strokeStyle = '#ffffff'; ctx.lineJoin = 'round';
    ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = INK; ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }
  for (const a of animals) if (a.full) drawBubble(a, t);
  if (playing && hint.a > 0) {
    ctx.save(); ctx.globalAlpha = hint.a;
    ctx.font = `16px ${POP}`;
    const n = hint.lines.length, lh = 24;
    const w = Math.max(...hint.lines.map(s => ctx.measureText(s).width)) + 36, h = n * lh + 20;
    const y = H * 0.36 + Math.sin(t * 3) * 4;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    rr(W / 2 - w / 2, y - h / 2, w, h, 22); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK;
    hint.lines.forEach((s, i) => ctx.fillText(s, W / 2, y - (n - 1) * lh / 2 + i * lh + 1));
    ctx.restore();
  }
}

let last = performance.now(), acc = 0;
function physStep() {
  stepKinematics(1 / 60); Engine.update(engine, 1000 / 60);
  if (eatQueue.length) {
    const q = eatQueue; eatQueue = [];
    for (const [b, a] of q) if (!b.gone && !a.full) eat(b, a);
    balls = balls.filter(b => !b.gone);
  }
  if (fxQueue.length) {
    const q = fxQueue; fxQueue = [];
    for (const [k, b, o] of q) if (!b.gone) FX[k](b, o);
    balls = balls.filter(b => !b.gone);
  }
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  update(dt, t);
  acc += dt; let steps = 0;
  while (acc >= 1 / 60 && steps < 3) { physStep(); acc -= 1 / 60; steps++; }
  if (steps === 3) acc = 0;
  draw(t);
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
function startPlay() {
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  playing = true; $('start').hidden = true; $('bar').hidden = false; $('pill').hidden = false;
}
$('playBtn').addEventListener('click', () => { startPlay(); fanfare(false); });
function openSelect() {
  const g = $('selGrid'); g.innerHTML = '';
  for (let i = 1; i <= STAGES.length; i++) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sbtn' + (i === stage && playing ? ' now' : ''); b.textContent = i;
    b.addEventListener('click', () => {
      $('select').hidden = true; $('done').hidden = true; particles = [];
      stage = i; cur = pickStage(i); buildStage(makeSpec(cur));
      startPlay(); fanfare(false);
    });
    g.appendChild(b);
  }
  $('select').hidden = false;
}
$('selOpen').addEventListener('click', openSelect);
$('pill').addEventListener('click', openSelect);
$('selClose').addEventListener('click', () => { $('select').hidden = true; });
function showDone() {
  const stars = flushCount <= curPar ? 3 : flushCount === curPar + 1 ? 2 : 1;
  $('clearLbl').textContent = `ステージ ${stage} クリア！`;
  [...$('stars').children].forEach((el, i) => {
    el.classList.remove('on'); void el.getBoundingClientRect();
    el.style.animationDelay = (0.2 + i * 0.18) + 's';
    if (i < stars) el.classList.add('on');
  });
  $('stars').setAttribute('aria-label', `ほし ${stars}こ`);
  $('starHint').textContent = stars === 3 ? 'すごい！ ほし みっつ！' : `「ながす」 ${curPar}かいで ほし みっつ！`;
  $('done').hidden = false;
}
$('nextBtn').addEventListener('click', () => {
  $('done').hidden = true; particles = [];
  stage++; cur = pickStage(stage); buildStage(makeSpec(cur));
});
$('retryBtn').addEventListener('click', () => {
  $('done').hidden = true; particles = [];
  buildStage(makeSpec(cur));
});
$('undoBtn').addEventListener('click', () => {
  const l = lines.pop(); if (l) { Composite.remove(world, l.bodies); tone(392, 0.15, 0.08, 'triangle'); updatePill(); }
});
$('clearBtn').addEventListener('click', () => {
  for (const l of lines) Composite.remove(world, l.bodies); lines = []; tone(330, 0.2, 0.08, 'triangle', 0, 520); updatePill();
});
$('flowBtn').addEventListener('click', () => {
  if (!playing || doneShown || animals.every(a => a.full)) return;
  flowLeft = Math.min(BURST * 2, flowLeft + BURST);
  flushCount++;
  $('flowBtn').classList.remove('pulse');
  whoosh();
});

let rt = null, lastSize = [0, 0];
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (Math.abs(app.clientWidth - lastSize[0]) > 40 || Math.abs(app.clientHeight - lastSize[1]) > 60) {
      lastSize = [app.clientWidth, app.clientHeight]; setup();
    }
  }, 200);
});

lastSize = [app.clientWidth, app.clientHeight];
setup();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load(`16px "Mochiy Pop One"`).catch(() => {});
})();
</script>
