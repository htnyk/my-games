<style>
/* Layout: full-screen canvas game (side-scroller). DOM overlays = sketchbook-paper cards for title / clear / ending. Single deliberate look, no theme switching. */
:root{
  --ink:#2a2233;
  --paper:#ffffff;
  --grid:#d7e8f7;
  --sun:#ffc93c;
  --berry:#ff5d8f;
  --leaf:#2fbf71;

  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--font-ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;touch-action:none;display:block}
#safeProbe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font-family:var(--font-ui);color:var(--ink);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.hudbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;z-index:5;padding:0}
.hudbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.hudbtn svg{width:24px;height:24px}
#homeBtn{left:calc(env(safe-area-inset-left,0px) + 10px)}
#muteBtn{right:calc(env(safe-area-inset-right,0px) + 10px)}
#goBtn{position:fixed;z-index:6;border:4px solid var(--ink);border-radius:20px;background:var(--sun);box-shadow:0 5px 0 var(--ink);font:900 22px/1 var(--font-ui);letter-spacing:.06em;padding:0;animation:pulse 1.2s ease-in-out infinite}
#goBtn.attack{background:#ff7ab6;color:#fff;text-shadow:0 2px 0 var(--ink);border-radius:999px;font-size:20px;white-space:nowrap;letter-spacing:0;animation:wiggle .9s ease-in-out infinite}
#goBtn.attack::before,#goBtn.attack::after{content:"★";color:var(--sun);font-size:.75em;margin:0 .1em;text-shadow:0 1px 0 var(--ink)}
@keyframes wiggle{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.08)}}
#goBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
@keyframes pulse{50%{transform:scale(1.06)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font:700 15px var(--font-ui);z-index:7;white-space:nowrap}
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px);overflow:auto;background:rgba(28,22,51,.28)}
.card{position:relative;width:min(640px,100%);margin:auto;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 rgba(28,22,51,.55);padding:26px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.card::before{content:"";position:absolute;left:24px;right:24px;top:-12px;height:22px;background:radial-gradient(circle at 50% 50%,var(--paper) 0 5px,var(--ink) 5.5px 8px,transparent 8.5px) 0 0/28px 22px repeat-x}
.logo{margin:0;font-family:var(--font-hand);font-weight:400;line-height:1.05;display:flex;flex-direction:column;align-items:center;gap:2px}
.logo .l1{font-size:clamp(20px,4.6vw,30px)}

.logo .l2 em{font-style:normal;display:inline-block;margin-left:.1em;background:var(--berry);color:#fff;border:4px solid var(--ink);border-radius:50%;width:1.25em;height:1.25em;line-height:1.1em;font-size:.8em;transform:rotate(8deg);vertical-align:.08em}

.stg .num{width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font-size:15px;text-shadow:0 1px 0 var(--ink)}

.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.mochi{display:inline-block;width:24px;height:26px;background:var(--mochi) center/contain no-repeat;image-rendering:pixelated;vertical-align:middle}

  #clearScr .mid{font-size:16px;padding:8px 14px;min-height:46px}
  #clearScr .card>.mid{display:none}

}
.yatta{margin:0;font:400 clamp(40px,10vw,64px) var(--font-hand);color:var(--berry);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.gotline{margin:0;font:900 18px var(--font-ui)}
.endtxt{margin:0;font:700 clamp(15px,3.6vw,18px)/1.7 var(--font-ui)}
.tsuzuku{margin:0;font:400 clamp(26px,6vw,38px) var(--font-hand)}

@keyframes pop{from{transform:scale(.2) rotate(-20deg)}to{transform:none}}
@media (prefers-reduced-motion: reduce){#goBtn,#goBtn.attack,.gotmochi{animation:none}}
</style>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), cx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK='#2a2233';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const TAU=Math.PI*2;

/* ---------------- layout ---------------- */
let BASE_S=1,W=0,H=0,DPR=1,S=1,VW=0,VH=0,SAFE={t:0,r:0,b:0,l:0};
const pad={y:0,h:0,sx:0,sy:0,sw:0,sh:0,kp:1,cx:0,cy:0,stripH:52,gx0:0,gx1:0};
const HUDP={jx:0,jy:0,sy:0};
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  BASE_S=(H>W?W/520:Math.min(W/760,H/420))*((G&&G.th&&G.th.spd>1&&!G.demo)?(H>W?0.76:0.88):1);
  S=BASE_S*(G?G.zoom:1);
  VW=W/S;VH=H/S;
  const cs=getComputedStyle($('safeProbe'));
  SAFE={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
  pad.stripH=H<500?42:52;
  pad.y=Math.round(H*0.52);pad.h=H-pad.y;
  pad.sh=Math.max(80,pad.h-pad.stripH-10-SAFE.b);
  pad.sw=Math.min(W-32-SAFE.l-SAFE.r,pad.sh*2.4);
  pad.sx=(W-pad.sw)/2;pad.sy=pad.y+pad.stripH;
  pad.cx=pad.sx+pad.sw/2;pad.cy=pad.sy+pad.sh/2;pad.kp=pad.sh/240;
  HUDP.jx=SAFE.l+82;HUDP.jy=SAFE.t+34;HUDP.sy=SAFE.t+32;
  placeGo();
  $('rotHint').hidden=!(H>W);
}
function placeGo(){
  const gb=$('goBtn');const right=W-(pad.sx+pad.sw)-SAFE.r;
  if(right>150){
    gb.style.width='132px';gb.style.height='78px';
    gb.style.left=(pad.sx+pad.sw+(right-132)/2)+'px';gb.style.top=(pad.sy+pad.sh/2-39)+'px';
    pad.gx0=pad.sx;pad.gx1=pad.sx+pad.sw;
  }else{
    const bh=pad.stripH-8;
    gb.style.width='128px';gb.style.height=bh+'px';
    gb.style.left=(W-16-128-SAFE.r)+'px';gb.style.top=(pad.y+4)+'px';
    pad.gx0=pad.sx;pad.gx1=W-16-128-SAFE.r-14;
  }
}

/* ---------------- audio ---------------- */
const AU={ctx:null,master:null,sfx:null,bgm:null,bgmF:null,noise:null,muted:false,last:{}};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC();}catch(e){return;}
  AU.ctx=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;comp.connect(c.destination);
  AU.master=c.createGain();AU.master.gain.value=AU.muted?0:0.9;AU.master.connect(comp);
  AU.sfx=c.createGain();AU.sfx.gain.value=1;AU.sfx.connect(AU.master);
  AU.bgmF=c.createBiquadFilter();AU.bgmF.type='lowpass';AU.bgmF.frequency.value=16000;
  AU.bgm=c.createGain();AU.bgm.gain.value=0.24;AU.bgm.connect(AU.bgmF);AU.bgmF.connect(AU.master);
  const len=c.sampleRate;const b=c.createBuffer(1,len,c.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;
  TR.bus=c.createGain();TR.bus.gain.value=1;TR.bus.connect(AU.master); /* 録音曲はローパスもダッキングもしない（描く画面でも同じ音量） */
  for(const k of TR.keep)decodeTrack(k);
  Music.next=0;
}
const now=()=>AU.ctx?AU.ctx.currentTime:0;
/* recorded songs: お菓子の森 / お化け屋敷 course songs and the ウサ2 theme song.
   Fetched at load, decoded after the first tap, looped without the silent tail. */
const TR={files:{forest:'yuusha-usa-2-audio/okashi.mp3',mansion:'yuusha-usa-2-audio/obake.mp3',theme:'yuusha-usa-2-audio/theme.mp3',sea:'yuusha-usa-2-audio/sea.mp3',sky:'yuusha-usa-2-audio/sky.mp3',boss:'yuusha-usa-2-audio/boss.mp3',final:'yuusha-usa-2-audio/final.mp3',fboss:'yuusha-usa-2-audio/fboss.mp3',title:'yuusha-usa-2-audio/title.mp3'},raw:{},buf:{},off:{},dec:{},keep:new Set(['title']),src:null,g:null,cur:null,want:null,bus:null,vol:0.42,startAt:0};
for(const k in TR.files){try{fetch(TR.files[k]).then(r=>r.ok?r.arrayBuffer():null).then(ab=>{if(ab){TR.raw[k]=ab;if(TR.keep.has(k)||TR.want===k)decodeTrack(k);}}).catch(()=>{});}catch(e){}}
function decodeTrack(k){ /* 必要な曲だけデコードする（スマホのメモリ節約）。圧縮データは残しておく */
  if(!AU.ctx||!TR.raw[k]||TR.buf[k]||TR.dec[k])return;TR.dec[k]=true;const ab=TR.raw[k].slice(0);
  const ok=b=>{TR.dec[k]=false;if(!(TR.keep.has(k)||TR.want===k||TR.cur===k))return;
    const d=b.getChannelData(0),n=d.length,th=0.004;let i=0,j=n-1;while(i<n&&Math.abs(d[i])<th)i++;while(j>i&&Math.abs(d[j])<th)j--;
    b._ls=i/b.sampleRate;b._le=Math.max(b._ls+1,(j+1)/b.sampleRate);TR.buf[k]=b;
    if(TR.want===k&&TR.cur!==k){startTrack(k);Music.on=false;}};
  try{const pr=AU.ctx.decodeAudioData(ab,ok,()=>{TR.dec[k]=false;});if(pr&&pr.catch)pr.catch(()=>{TR.dec[k]=false;});}catch(e){TR.dec[k]=false;}
}
function trNeed(list){TR.keep=new Set(['title'].concat(list));for(const k in TR.buf)if(!TR.keep.has(k)&&TR.cur!==k&&TR.want!==k)delete TR.buf[k];for(const k of TR.keep)decodeTrack(k);}
function trackPos(){const b=TR.buf[TR.cur];if(!b)return 0;let p=AU.ctx.currentTime-TR.startAt;if(p>=b._le)p=b._ls+(p-b._ls)%(b._le-b._ls);return p;}
function startTrack(k){
  const c=AU.ctx,b=TR.buf[k];if(!c||!b)return;stopTrack();
  const src=c.createBufferSource();src.buffer=b;src.loop=true;src.loopStart=b._ls;src.loopEnd=b._le;
  const g=c.createGain();src.connect(g);g.connect(TR.bus);
  let off=TR.off[k];if(!(off>=b._ls&&off<b._le))off=b._ls;
  const t=c.currentTime;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(TR.vol,t+(off>b._ls+0.5?0.5:0.08));
  src.start(t,off);TR.startAt=t-off;TR.src=src;TR.g=g;TR.cur=k;
}
function stopTrack(){
  if(!TR.src)return;const c=AU.ctx,t=c.currentTime;TR.off[TR.cur]=trackPos();
  const g=TR.g,src=TR.src;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+0.25);try{src.stop(t+0.3);}catch(e){}
  TR.src=null;TR.g=null;TR.cur=null;
}
function osc(type,f,t,dur,vol,out,o={}){
  const c=AU.ctx;const n=c.createOscillator();n.type=type;n.frequency.setValueAtTime(f,t);
  if(o.f2)n.frequency.exponentialRampToValueAtTime(o.f2,t+(o.glide||dur*0.8));
  const g=c.createGain();const a=o.a||0.005;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);
  if(o.hold)g.gain.setValueAtTime(vol,t+a+o.hold);
  g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(dur,a+(o.hold||0)+0.02));
  let node=n;
  if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;fl.Q.value=o.q||0.7;n.connect(fl);node=fl;}
  if(o.vib){const l=c.createOscillator();l.frequency.value=o.vib[0];const lg=c.createGain();lg.gain.value=o.vib[1];l.connect(lg);lg.connect(n.frequency);l.start(t);l.stop(t+dur+0.1);}
  node.connect(g);g.connect(out||AU.sfx);n.start(t);n.stop(t+dur+0.1);
}
const PENT=[0,2,4,7,9];
function penNote(idx,vel,dec){
  const c=AU.ctx;if(!c)return;idx=clamp(idx,0,14);
  if(!AU.echo){const d=c.createDelay(0.6);d.delayTime.value=0.19;const fb=c.createGain();fb.gain.value=0.34;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;

function sched(step,t,sd){

    const b2=bar&1;

    if(onE){const r=b2?-4:0;const bn=((e8&1)?12:0)+r-24;osc('triangle',mf(R,bn),t,0.16,0.5,o);osc('sine',mf(R,bn),t,0.14,0.35,o);}
    if(s16%4===0)osc('sine',150,t,0.2,0.8,o,{f2:45,glide:0.12});
    if(s16===4||s16===12){nz(t,0.14,0.32,'bandpass',1600,0.9,o);nz(t+0.012,0.1,0.2,'bandpass',2200,0.9,o);}

    return;
  }
  const L=s.kind==='title'?3:(s.kind==='end'?6:Music.level);
  const mm=n=>s.minor?mapMinor(n):n;
  if(onE){const n=MEL[e8];if(typeof n==='number'){let len=1;while(MEL[(e8+len)%64]==='-')len++;
    lead(s.lead,mf(R,mm(n)+12),t,len*sd*2*0.9,0.22);
    if(L>=6){osc('sine',mf(R,mm(n)+24),t,0.5,0.06,o);osc('sine',mf(R,mm(n)+24)*2.76,t,0.22,0.02,o);}}}
  const ch=CHT[bar].map(mm);
  if(onE){const bp=BASSP[e8&7];if(bp!==null){const fr=mf(R,ch[0]-24+bp);osc('triangle',fr,t,0.2,0.48,o);osc('sine',fr,t,0.18,0.35,o);}}
  if(L>=1&&(s16===0||s16===8))osc('sine',150,t,0.2,0.75,o,{f2:45,glide:0.12});
  if(L>=3&&s16===14)osc('sine',140,t,0.16,0.45,o,{f2:45,glide:0.1});
  if(L>=1&&s16%4===2)nz(t,0.04,0.11,'highpass',8000,0.7,o);
  if(L>=6&&s16%2===1)nz(t,0.03,0.05,'highpass',9000,0.7,o);
  if(L>=4&&(s16===4||s16===12)){nz(t,0.13,0.3,'bandpass',1700,0.9,o);nz(t+0.012,0.09,0.18,'bandpass',2300,0.9,o);}
  if(L>=2&&s16%4===2)ch.forEach(x=>osc('square',mf(R,x+12),t,0.1,0.042,o,{lp:1900}));
  if(L>=3){const ar=[0,1,2,1];osc('triangle',mf(R,ch[ar[s16&3]]+(s16&8?24:12)),t,0.09,0.045,o);}
  if(L>=5&&s16===0)[ch[1],ch[2]].forEach(x=>osc('sine',mf(R,x+12),t,sd*15,0.045,o,{a:0.25,hold:sd*8}));
}

/* ---------------- level ---------------- */
const BH=48,BW=56,PR=5,GRAV=1250,STEP=1/120;
function buildLevel(def,spd,grav){
  spd=spd||1;grav=grav||1;
  const segs=[],gaps=[];let x=-700,y=0;let cur={x0:x,pts:[[x,y]]};
  const L={towers:[],pads:[],items:[],critters:[],flags:[],cages:[],rains:[],doors:[],elevs:[],dashes:[],cannons:[],loops:[],cliffs:[],vrings:[],vends:[],boss:null,goal:null,segs,gaps,startX:150};
  const raw=[];
  const tower=(tx,n,dy,soft)=>L.towers.push({x:tx,w:BW,n,n0:n,y0:y,dy:dy||0,soft:!!soft,touch:false,was:false,contact:0,last:-9,broken:false,seed:hash(tx*0.37)});
  for(const e of def){
    const c=e.c,m=e.m||1,k=c[0];
    if(k==='flat'){x+=c[1];cur.pts.push([x,y]);}
    else if(k==='up'||k==='down'||k==='hill'){
      const len=c[1],h=c[2],N=Math.max(2,Math.ceil(len/24)),y0=y;
      for(let i=1;i<=N;i++){const f=i/N;let yy;
        if(k==='up')yy=y0-h*(0.5-0.5*Math.cos(Math.PI*f));
        else if(k==='down')yy=y0+h*(0.5-0.5*Math.cos(Math.PI*f));
        else yy=y0-h*(0.5-0.5*Math.cos(TAU*f));
        cur.pts.push([x+len*f,yy]);}
      x+=len;y=k==='up'?y0-h:k==='down'?y0+h:y0;
    }
    else if(k==='lin'){const len=c[1],h=c[2];cur.pts.push([x+len,y-h]);x+=len;y-=h;}
    else if(k==='dip'){const len=c[1],h=c[2],N=Math.max(2,Math.ceil(len/24)),y0=y;for(let i=1;i<=N;i++){const f=i/N;cur.pts.push([x+len*f,y0+h*(0.5-0.5*Math.cos(TAU*f))]);}x+=len;}
    else if(k==='steps'){const n=c[1],run=c[2],rise=c[3],ar=Math.abs(rise);
      for(let i=0;i<n;i++){raw.push([x+run*0.3,72]);raw.push([x+run*0.6,72]);raw.push([x+run*0.45,130]);x+=run;cur.pts.push([x,y]);x+=ar;y-=rise;cur.pts.push([x,y]);}}
    else if(k==='wig'){const len=c[1],A1=c[2],l1=c[3],A2=c[4]||0,l2=c[5]||300,N=Math.ceil(len/24),y0=y; /* グネグネ道 */
      const sm=u=>u*u*(3-2*u);
      for(let i=1;i<=N;i++){const f=i/N,d=len*f,env=sm(clamp(Math.min(f/0.12,(1-f)/0.12),0,1));
        cur.pts.push([x+d,y0-env*(A1*Math.sin(TAU*d/l1)+A2*Math.sin(TAU*d/l2+1.3))]);}
      const rows=clamp(Math.round(m*1.3),1,5);for(let r=0;r<rows;r++)for(let i=0;i<len/55-2;i++)raw.push([x+60+i*55+(r%2)*27,58+r*50+(r>=3?0:0)]);
      x+=len;}
    else if(k==='vring'){L.vrings.push({x:x+60,y:y,type:c[1],an:c[1]==='iruka'?(Math.random()<0.5?'iruka':'same'):null,done:false});x+=160;cur.pts.push([x,y]);}
    else if(k==='vend'){L.vends.push({x:x+40,y:y,done:false});x+=120;cur.pts.push([x,y]);}
    else if(k==='drop'){cur.x1=x;segs.push(cur);y+=c[1];cur={x0:x,pts:[[x,y]]};}
    else if(k==='skyitems'){const len=c[1],h0=c[2],h1=c[3]; /* 空に うねうねの 星の道 */
      for(let i=0;i*64<len;i++){const xx=x+80+i*64,band=0.5+0.5*Math.sin(i*0.21),hc=h0+(h1-h0)*band;
        raw.push([xx,hc]);raw.push([xx+18,hc+58]);raw.push([xx+18,hc-58]);if(m>=3&&i%2)raw.push([xx+32,hc+116]);
        if(i%10===5)tower(xx+30,1+(i%20===5?1:0),hc+130,true);if(i%10===0)tower(xx,1,Math.max(40,hc-190),true);}}
    else if(k==='sgap'){const w=Math.round(c[1]*Math.pow(spd,1.4));cur.x1=x;segs.push(cur);gaps.push({x0:x,x1:x+w});x+=w;cur={x0:x,pts:[[x,y]]};}
    else if(k==='cliff'){const D=c[1],X=x,v0=470*spd; /* 高いところから とびおりる */
      cur.x1=x;segs.push(cur);y+=D;cur={x0:x,pts:[[x,y]]};L.cliffs.push({x:X,done:false});
      const hAt=grav<0.9?(dx,sc)=>{const t=dx/(v0*sc);return D-300*t-1080*t*t;}:(dx,sc)=>D-625*grav*Math.pow(dx/(v0*sc),2);
      [0.72,0.84,0.96,1.08,1.22].forEach((sc,si)=>{for(let dx=50;dx<1600*spd;dx+=54){const h=hAt(dx,sc);if(h<44)break;raw.push([X+dx,h]);if(m>=3||si%2===0)raw.push([X+dx+22,h+56]);}});
      [[0.84,0.38],[1.0,0.62],[1.14,0.8]].forEach(a=>{const dx=v0*a[0]*a[1]*1.1,h=hAt(dx,a[0]);if(h>110)tower(X+dx,1+(Math.round(dx)%2),h-BH/2,true);});
      for(let i=0;i<10;i++)raw.push([X+v0*1.1+i*58+(i%2)*10,60+(i%2)*52]);}
    else if(k==='loop'){const r=c[1]||210,sh=260,lx=x+80; /* 一回転ループ */
      L.loops.push({x:lx,y:y,r,sh,done:false});
      for(let th=0.25;th<TAU-0.1;th+=0.27){const rho=r-62,xx=lx+sh*th/TAU+rho*Math.sin(th),hh=r-rho*Math.cos(th);raw.push([xx,hh]);}
      for(let th=0.5;th<TAU-0.3;th+=0.54){const rho=r-118,xx=lx+sh*th/TAU+rho*Math.sin(th),hh=r-rho*Math.cos(th);raw.push([xx,hh]);}
      for(let i=0;i<6;i++)raw.push([lx-330+i*55,60]);
      x=lx+sh+80;cur.pts.push([x,y]);}
    else if(k==='gap'){cur.x1=x;segs.push(cur);gaps.push({x0:x,x1:x+c[1]});x+=c[1];cur={x0:x,pts:[[x,y]]};}
    else if(k==='tower'){const cn=Math.max(1,Math.round(m*1.1)),h0=c[1]+(m>3.2?1:0);
      for(let j=0;j<cn;j++){const h=h0+(j%2),tx=x+40+j*(BW+8);tower(tx,h);if(c[2]){raw.push([tx+BW/2-14,h*BH+34]);raw.push([tx+BW/2+14,h*BH+34]);}}
      x+=40+cn*(BW+8)+90;cur.pts.push([x,y]);}
    else if(k==='wall'){const add=Math.round(Math.max(0,m-2));for(const h0 of c[1]){const h=h0+add;tower(x+20,h);raw.push([x+20+BW/2,h*BH+34]);x+=BW+8;}x+=160;cur.pts.push([x,y]);}
    else if(k==='air'){const n=Math.max(1,Math.round(c[1]*m*1.05));for(let i=0;i<n;i++)L.critters.push({x:x+240+i*110,y:0,dy:130+(i%3)*70,air:true,vx:0,st:'walk',t:hash(x*1.7+i)*6,rot:0,vy:0});}
    else if(k==='float'){const n=Math.max(2,Math.round(c[1]*m*1.3));
      for(let i=0;i<n;i++){const dy=170+(i%4)*70,w=3+(i%2),bx=x+100+i*190;
        for(let j=0;j<w;j++){const h=1+(m>3&&j===1?1:0);tower(bx+j*BW,h,dy);raw.push([bx+j*BW+BW/2,dy+BH*h+34]);}
        for(let r=0;r<2;r++)for(let j=0;j<5;j++)raw.push([bx-20+j*52+r*26,dy+150+r*55]);
        raw.push([bx+w*BW+40,dy-50]);raw.push([bx+w*BW+80,dy-10]);
        if(i%2)tower(bx+w*BW+110,1,dy+150);}}
    else if(k==='bounce'){L.pads.push({x:x+40,w:76,y0:y,sq:0});x+=160;cur.pts.push([x,y]);}
    else if(k==='items'){const n=c[1],p=c[2];
      if(p==='line'){const rows=clamp(Math.round(m*1.5),1,6);for(let r=0;r<rows;r++)for(let i=0;i<n;i++)raw.push([x+60+i*55+(r%2)*27,55+r*52]);}
      else if(p==='spread'){const rows=clamp(Math.round(m*1.2),1,4);for(let r=0;r<rows;r++)for(let i=0;i<n;i++)raw.push([x+60+i*100+(r%2)*50,62+r*56]);}
      else if(p==='arc'){const arcs=clamp(Math.round(m*1.2),1,4);for(let a=0;a<arcs;a++){const nn=n+a*2,w=(n-1)*60+a*80;for(let i=0;i<nn;i++){const f=nn>1?i/(nn-1):0.5;raw.push([x+40-a*40+f*w,60+a*50+Math.sin(Math.PI*f)*120]);}}}
      else{const rows=clamp(Math.round(m*1.2),1,4);for(let r=0;r<rows;r++)for(let i=0;i<n;i++){const f=n>1?i/(n-1):0.5;raw.push([x+90+i*55+(r%2)*27,230+r*60+Math.sin(Math.PI*f)*90]);}}}
    else if(k==='critter'){const n=Math.max(1,Math.round(c[1]*m*1.2));for(let i=0;i<n;i++)L.critters.push({x:x+160+i*75,y:y,vx:-(32+hash(x+i)*22),st:'walk',t:hash(x*1.3+i)*6,rot:0,vy:0});}
    else if(k==='flag'){L.flags.push({x:x+40,y:y,done:false});}
    else if(k==='cage'){L.cages.push({x:x+160,y:y,fi:c[1],st:'locked',t:0});for(let i=0;i<8;i++)raw.push([x+60+i*40,60+Math.sin(i/7*Math.PI)*140]);x+=320;cur.pts.push([x,y]);}
    else if(k==='boss'){L.boss={x:x+80};x+=1100;cur.pts.push([x,y]);}
    else if(k==='goal'){L.goal={x:x+60,y:y};}
    else if(k==='rain'){L.rains.push({x:x+40,done:false});for(let i=0;i<10;i++)raw.push([x+300+i*140,330+hash(x+i)*60]);}
    else if(k==='door'){L.doors.push({x:x+80,y:y,done:false});
      /* ワープ後のウサの軌道（実測: 出現時の高さ約640、そこから放物線で落下）に沿って、速さの違い(s)ごとに何本もの弧を並べる */
      const dx0=x+80,hAt=(dx,s)=>640-0.00121*Math.pow(Math.max(0,dx-100)/s,2);
      const ss=[0.68,0.78,0.88,0.98,1.08,1.2];
      ss.forEach((s,si)=>{for(let dx=130;dx<1400;dx+=52){const h=hAt(dx,s);if(h<44)break;
        raw.push([dx0+dx,h]);if(m>=3||si%2===0)raw.push([dx0+dx+26,h+58]);}});
      /* 落下の途中にやわらかブロック（体当たりで壊せる） */
      [[0.78,330],[0.98,300],[1.16,270],[0.88,520],[1.08,470]].forEach(a=>{const h=hAt(a[1],a[0]);if(h>110)tower(dx0+a[1],1+(a[1]%2===0?1:0),h-BH/2,true);});
      /* 着地した先にも星の道 */
      for(let r=0;r<2;r++)for(let i=0;i<11;i++)raw.push([dx0+900+i*58+(r%2)*29,60+r*56+Math.sin(i/10*Math.PI)*70]);
      x+=200;cur.pts.push([x,y]);}
    else if(k==='elev'){L.elevs.push({x:x+40,w:380,said:false});for(let col=0;col<6;col++)for(let r=0;r<10;r++)raw.push([x+60+col*62,100+r*58]);
      for(let i=0;i<4;i++)tower(x+70+i*90,1,520+(i%2)*60,true);
      for(let i=0;i<6;i++){tower(x+470+i*90,1,420-i*60,true);raw.push([x+470+i*90+BW/2,560-i*60]);raw.push([x+470+i*90+BW/2,500-i*60]);}
      x+=460;cur.pts.push([x,y]);}
    else if(k==='dash'){L.dashes.push({x:x+40,w:110,y:y,last:-9});for(let r=0;r<4;r++)for(let i=0;i<12;i++)raw.push([x+200+i*55,60+r*55]);x+=170;cur.pts.push([x,y]);}
    else if(k==='cannon'){L.cannons.push({x:x+60,y:y,done:false});
      for(let t=0.12;t<2.3;t+=0.07){const h=t<1.212?1000*t-412.5*t*t:606-625*(t-1.212)*(t-1.212);if(h<40)continue;raw.push([x+60+950*t,h+40]);raw.push([x+60+950*t+20,h+96]);raw.push([x+60+950*t-10,h-10]);}
      for(let t=0.35;t<2.1;t+=0.3){const h=t<1.212?1000*t-412.5*t*t:606-625*(t-1.212)*(t-1.212);if(h>80)tower(x+60+950*t,1,h+10,true);}
      x+=140;cur.pts.push([x,y]);}
  }
  cur.x1=x;segs.push(cur);
  let maxY=0;

    const n=Math.max(2,Math.ceil((s.x1-s.x0)/8)+1);s.ys=new Float32Array(n);let j=0;const P=s.pts;
    for(let i=0;i<n;i++){const xx=Math.min(s.x1,s.x0+i*8);while(j<P.length-2&&P[j+1][0]<xx)j++;
      const a=P[j],b=P[Math.min(j+1,P.length-1)];const t=b[0]>a[0]?clamp((xx-a[0])/(b[0]-a[0]),0,1):0;s.ys[i]=a[1]+(b[1]-a[1])*t;if(s.ys[i]>maxY)maxY=s.ys[i];}
  }
  L.fallY=maxY+650;
  const gn=x0=>{for(let d=0;d<600;d+=20){let g=gAt(segs,x0-d);if(g!=null)return g;g=gAt(segs,x0+d);if(g!=null)return g;}return 0;};
  for(const r of raw)L.items.push({x:r[0],y:gn(r[0])-r[1],taken:false});
  for(const c of L.critters){if(c.air){c.by=gn(c.x)-c.dy;c.y=c.by;}else c.y=gn(c.x);}
  for(const t of L.towers)t.y0=gn(t.x+BW/2)-t.dy;
  for(const p of L.pads)p.y0=gn(p.x+38);
  for(const d of L.doors)d.y=gn(d.x);
  for(const d of L.dashes)d.y=gn(d.x);
  for(const c of L.cages)c.y=gn(c.x);
  for(const c of L.cannons)c.y=gn(c.x);
  L.total=L.towers.reduce((a,t)=>a+t.n,0)+L.items.length+L.critters.length;
  return L;
}
function segOf(segs,x){for(let i=0;i<segs.length;i++){const s=segs[i];if(x>=s.x0&&x<=s.x1)return s;}return null;}
function segY(s,x){const f=(x-s.x0)/8;let i=Math.floor(f);if(i<0)return s.ys[0];if(i>=s.ys.length-1)return s.ys[s.ys.length-1];const t=f-i;return s.ys[i]+(s.ys[i+1]-s.ys[i])*t;}
function segSl(s,x){let i=Math.floor((x-s.x0)/8);i=clamp(i,0,s.ys.length-2);return (s.ys[i+1]-s.ys[i])/8;}
function gAt(segs,x){const s=segOf(segs,x);return s?segY(s,x):null;}
const groundAt=x=>gAt(G.lv.segs,x);
function groundNear(x){for(let d=0;d<900;d+=30){let g=groundAt(x-d);if(g!=null)return g;g=groundAt(x+d);if(g!=null)return g;}return 0;}

function strokeLen(s){let L=0;for(let i=1;i<s.length;i++)L+=Math.hypot(s[i].x-s[i-1].x,s[i].y-s[i-1].y);return L;}

function onGo(){

  }else if(G.strokes.length){
    const old=G.body;const nb=makeBody(old.restStrokes.concat(G.strokes));

    for(const p of nb.P){p.x=ox+p.rx;p.y=oy+p.ry;}
    liftAboveGround(nb);G.body=nb;
  }
  const b=G.body;applyKind(b);b.drive=true;b.damp=0;b.sq=1;bodyStats(b,0);

function hitTower(tw,k){
  k=Math.min(k,tw.n);if(k<=0)return;
  for(let i=0;i<k;i++){const by=tw.y0-tw.n*BH;debris(tw.x+BW/2,by+BH/2,tw.seed+tw.n);tw.n--;}
  addKira(k,tw.x+BW/2,tw.y0-tw.n*BH-20);sfx('brk',k>=2);
  if(!RM)G.shake=Math.max(G.shake,Math.min(0.6,0.15*k));
  if(tw.n<=0)tw.broken=true;
}

    if(T>1.0&&T<2.9){B.fxA=(B.fxA||0)+dt;while(B.fxA>0.035){B.fxA-=0.035;const a=Math.random()*TAU,rr0=380+Math.random()*120;
      G.wfx.push({k:'spark',x:mx0+Math.cos(a)*rr0,y:my0+Math.sin(a)*rr0*0.8,vx:-Math.cos(a)*rr0*2.3,vy:-Math.sin(a)*rr0*0.8*2.3,r:7+Math.random()*5,life:0.42,max:0.42,c:BCOL[Math.floor(Math.random()*5)],rot:0,nodrag:true});}}

/* ---------------- update ---------------- */
function update(dt){

  G.zoom=lerp(G.zoom,G.zoomT,1-Math.pow(0.06,dt));S=BASE_S*G.zoom;VW=W/S;VH=H/S;
  G.flash=Math.max(0,G.flash-dt*2.6);G.dim=lerp(G.dim,G.dimT,1-Math.pow(0.1,dt));if(G.speedT>0)G.speedT-=dt;

  if(G.spot){const sp=G.spot;sp.t+=dt; /* たすけた瞬間は画面ぜんたいを止めて、ウサギだけ見せる */
    if(G.said)G.said.t+=dt;
    if(sp.t>=sp.dur){G.spot=null;}else{
      if(sp.t>0.6&&!sp.s1){sp.s1=true;sfx('mochi');}
      if(sp.t>1.4&&!sp.s2){sp.s2=true;sfx('rainbow');}
      return;}}
  if(G.freeze>0){G.freeze-=dt;return;}

  if(b){const x0=b.cx-600,x1=b.cx+700;G.near=lv.towers.filter(t=>!t.broken&&t.x>x0&&t.x<x1);G.nearPads=lv.pads.filter(p=>p.x>x0&&p.x<x1);}
  G.inElev=null;if(b&&mode==='run')for(const e of lv.elevs)if(b.cx>e.x&&b.cx<e.x+e.w){G.inElev=e;break;}
  if(G.dashT>0)G.dashT-=dt;
  const phys=b&&(mode==='run'||mode==='title'||mode==='boss'||mode==='goal'||mode==='clear'||mode==='rocket'||mode==='launch');
  if(phys){physAcc+=dt;let k=0;while(physAcc>=STEP&&k<8){physStep(STEP);physAcc-=STEP;k++;}if(k>=8)physAcc=0;bodyStats(b,dt);}
  if(mode==='launch')updateLaunch(dt);

}

function updateFx(dt){

    else if(p.k==='ring'){p.r+=p.vr*dt;}

  const a=clamp(Math.min(t/0.3,(d-t)/0.45),0,1);
  const e=1-Math.pow(1-clamp(t/0.75,0,1),3);
  const cxp=lerp(sp.sx,W/2,e),cyp=lerp(sp.sy,H*0.45,e),u=Math.min(W,H)/390,R=Math.min(W,H)*0.6;
  const g=cx.createRadialGradient(cxp,cyp,R*0.22,cxp,cyp,R*1.35);
  g.addColorStop(0,'rgba(10,6,34,0.1)');g.addColorStop(1,'rgba(10,6,34,'+(0.92*a)+')');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);

  for(let i=0;i<14;i++){cx.rotate(TAU/14);cx.beginPath();cx.moveTo(0,0);cx.lineTo(R*1.9,-R*0.08);cx.lineTo(R*1.9,R*0.08);cx.closePath();fs(i%2?'#fff3a0':f.col);}
  cx.restore();
  cx.globalAlpha=a*0.9;circ(cxp,cyp,R*0.42*e);fs('rgba(255,244,190,0.35)');circ(cxp,cyp,R*0.3*e);fs('rgba(255,255,255,0.35)');
  const sc=lerp(3*S,(H*0.46)/f.spr.height,e),hh=f.spr.height*sc,hop=Math.abs(Math.sin(t*7))*12*u*e;
  cx.globalAlpha=a;sprDraw(f.spr,cxp,cyp+hh/2-hop,sc,{rot:Math.sin(t*5)*0.06});
  for(let i=0;i<12;i++){const ang=t*1.4+i/12*TAU,r=(R*0.36+Math.sin(t*3+i)*10*u)*e,sz=(7+(i%3)*3)*u*(0.6+0.4*Math.sin(t*6+i));

  if(t>0.5){const k=clamp((t-0.5)/0.3,0,1),k2=1+Math.sin(clamp((t-0.5)/0.3,0,1)*Math.PI)*0.12,txt=f.jp+' を たすけたよ！';

  cx.globalAlpha=1;
}

/* ---------------- render ---------------- */
function render(){
  cx.setTransform(DPR,0,0,DPR,0,0);
  if(!G){cx.fillStyle='#1c1633';cx.fillRect(0,0,W,H);return;}
  let sx=0,sy=0;if(G.shake>0){sx=(Math.random()-0.5)*G.shake*16;sy=(Math.random()-0.5)*G.shake*16;}
  drawSky();drawBackdrop();cx.setTransform(DPR,0,0,DPR,0,0);
  if(G.th.id===2&&G.body&&!G.demo){const dp=clamp((G.camY+VH*0.5)/6500,0,0.6);if(dp>0.01){cx.fillStyle='rgba(2,10,45,'+dp+')';cx.fillRect(0,0,W,H);}}
  if(G.launch)drawSpace();
  if(G.dim>0.01){cx.fillStyle='rgba(40,14,70,'+G.dim+')';cx.fillRect(0,0,W,H);}
  cx.setTransform(DPR*S,0,0,DPR*S,(-G.camX*S+sx)*DPR,(-G.camY*S+sy)*DPR);
  drawWorld();
  cx.setTransform(DPR,0,0,DPR,0,0);
  if(G.speedT>0){cx.strokeStyle='rgba(255,255,255,'+clamp(G.speedT*1.6,0,0.8)+')';cx.lineCap='round';for(let i=0;i<16;i++){const y=hash(i*3.1)*H*0.8;const x=((G.t*2400+hash(i)*W*2)%(W*1.4))-W*0.2;cx.lineWidth=2+hash(i+5)*4;cx.beginPath();cx.moveTo(W-x,y);cx.lineTo(W-x-80-hash(i+2)*120,y);cx.stroke();}}
  drawScreenFx();drawSpot();drawHUD();if(G.padOn)drawPad();if(!G.spot){drawSay();drawHint();}
  if(G.flash>0){cx.fillStyle='rgba(255,255,255,'+Math.min(0.85,G.flash*0.8)+')';cx.fillRect(0,0,W,H);}
}

/* ---------------- input ---------------- */
let ptr=null;
function inSheet(x,y){return x>pad.sx-12&&x<pad.sx+pad.sw+12&&y>pad.sy-12&&y<pad.sy+pad.sh+12;}
function toRest(x,y){x=clamp(x,pad.sx+4,pad.sx+pad.sw-4);y=clamp(y,pad.sy+4,pad.sy+pad.sh-4);return {x:(x-pad.cx)/pad.kp,y:(y-pad.cy)/pad.kp};}
function addPt(x,y){
  if(!G.cur||G.ink<=0)return;const p=toRest(x,y);const l=G.cur[G.cur.length-1];let d=Math.hypot(p.x-l.x,p.y-l.y);
  if(d<3/pad.kp)return;
  if(d>G.ink){const k=G.ink/d;p.x=l.x+(p.x-l.x)*k;p.y=l.y+(p.y-l.y)*k;d=G.ink;}
  G.ink-=d;G.cur.push(p);sfx('draw',{d:d*pad.kp,y:(y-pad.sy)/pad.sh});
}
cv.addEventListener('pointerdown',e=>{
  audioInit();if(!G)return;const x=e.clientX,y=e.clientY;
  if(mode==='run'){G.hold=true;jump();return;}
  if(G.padOn&&inSheet(x,y)&&G.ink>0&&ptr===null){ptr=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}
    G.cur=[toRest(x,y)];G.strokes.push(G.cur);G.throwAt=0;updateGo();sfx('draw',{d:0,y:(y-pad.sy)/pad.sh,down:true});}
});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==ptr||!G)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of (evs.length?evs:[e]))addPt(ev.clientX,ev.clientY);});

let wake=null;async function requestWake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){}}

/* crayon-colored logo letters */
(function(){const cols=['#ff5d8f','#ff9f1c','#2fbf71','#3d8bff','#8a5cf6','#e8413c'];let k=0;
  const paint=el=>{const nodes=[...el.childNodes];el.textContent='';for(const n of nodes){if(n.nodeType===3){for(const ch of n.textContent){const s=document.createElement('span');s.textContent=ch;s.style.color=cols[k++%cols.length];s.style.transform='rotate('+((hash(k)-0.5)*10).toFixed(1)+'deg)';el.appendChild(s);}}else el.appendChild(n);}};
  paint($('logoL1'));paint($('logoL2'));})();
