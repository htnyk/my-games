<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>れいわ どうぶつ ばんちょう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@800&display=swap">
<style>
/* Layout: full-screen toy-block field; HUD cards pinned to the top corners, thumb pads bottom-right, joystick appears wherever a finger lands */
:root{
  --sky:#8fd3ff; --ink:#2b2340; --paper:#fffaf0; --paper-2:#f3ead9;
  --accent:#ff7a2f; --heart:#ff4f86; --gold:#ffc933; --xp:#8fe06a;
  --font-display:"Mochiy Pop One","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif;
  --font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --outline-sm:1.5px 0 var(--ink),-1.5px 0 var(--ink),0 1.5px var(--ink),0 -1.5px var(--ink),1px 1px var(--ink),-1px 1px var(--ink),1px -1px var(--ink),-1px -1px var(--ink);
  --outline:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink),0 4px var(--ink);
  --outline-lg:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink),0 6px var(--ink);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);font-weight:800;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;background:var(--sky)}
#game canvas{display:block;position:absolute;left:0;top:0}
.layer{position:absolute;inset:0;pointer-events:none}
button{font-family:var(--font-body);font-weight:800}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:grid;justify-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);pointer-events:none}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:0 4px 0 var(--ink)}
#bar{width:min(100%,460px);background:rgba(255,250,240,.8);border:2px solid var(--ink);border-radius:6px;box-shadow:0 3px 0 rgba(43,35,64,.55);padding:5px 8px 6px;display:grid;gap:4px}
.r1{display:flex;align-items:center;gap:8px;min-width:0}
.lv{font-family:var(--font-display);font-weight:400;font-size:12px;line-height:1;white-space:nowrap}
.lv b{font-weight:400;font-size:20px;margin-left:2px}
.lv small{font-size:11px;opacity:.7;margin-left:2px}
#hearts{display:flex;flex-wrap:wrap;font-size:14px;line-height:1;min-width:0}
.hp{color:#d6ccbd}
.hp.on{color:var(--heart)}
.grow{flex:1}
.kids{font-size:11px;white-space:nowrap;display:flex;align-items:center;gap:3px}
.kids b{font-family:var(--font-display);font-weight:400;font-size:17px;color:var(--heart);text-shadow:var(--outline-sm)}
#menuBtn{pointer-events:auto;width:34px;height:28px;padding:0;display:grid;place-items:center;font-size:18px;line-height:1;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:6px;box-shadow:0 2px 0 var(--ink);cursor:pointer}
#menuBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.xp{height:7px;border:2px solid var(--ink);border-radius:5px;background:#e9e1d2;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:var(--xp);transition:width .25s}
.xp.max i{background:var(--gold)}
.r3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10px}
#partsRow{display:flex;gap:3px;flex-wrap:wrap}
.pc{font-size:9.5px;line-height:1;padding:2px 4px;border:1.5px solid var(--ink);border-radius:3px;background:var(--c);white-space:nowrap}
.pc em{font-style:normal;opacity:.6;margin-right:2px}
#perks{color:#b5501a}
#bossBar{width:min(86%,340px);display:grid;gap:3px;justify-items:center}
#bossName{font-family:var(--font-display);font-size:13px;color:#fff;text-shadow:var(--outline)}
.bhp{width:100%;height:12px;border:2px solid var(--ink);border-radius:7px;background:rgba(43,35,64,.35);overflow:hidden}
.bhp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5d73,#ffb13b,#ffe14d,#6ad46a,#4fb3ff,#a77bff);transition:width .25s}
#bossBar.guard .bhp{border-color:#2f7fd0;box-shadow:0 0 0 3px #bfe9ff}
#bossArrow{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
#bossArrow .rot{position:absolute;left:-20px;top:-20px;width:40px;height:40px}
#bossArrow .rot::before,#bossArrow .rot::after{content:"";position:absolute;clip-path:polygon(8% 10%,96% 50%,8% 90%,30% 50%)}
#bossArrow .rot::before{inset:0;background:var(--ink)}
#bossArrow .rot::after{inset:7px 7px 7px 5px;background:#ff4f6d}
#bossArrow .lbl{position:absolute;left:0;top:0;font-family:var(--font-display);font-size:12px;color:#fff;text-shadow:var(--outline-sm);white-space:nowrap}

/* floating words */
#labels{overflow:hidden}
.pop{position:absolute;left:0;top:0;font-family:var(--font-display);font-size:20px;color:#fff;text-shadow:var(--outline);white-space:nowrap;will-change:transform}
.pop.eat{color:#ffe35a}
.pop.hurt{color:#ff8080}
.pop.heal{color:#ffa3c4}
.pop.part{color:#ffe35a;font-size:18px}
.pop.small{font-size:14px}
.pop.alert{font-size:30px;color:#ffe35a}
.pop.gabu{font-size:32px;color:#fff3a0}

#banner{position:absolute;left:50%;top:30%;transform:translateX(-50%);width:min(92vw,520px);text-align:center;pointer-events:none;display:grid;justify-items:center;gap:8px}
#bannerMain{font-family:var(--font-display);font-size:clamp(28px,8.5vw,46px);line-height:1.1;color:#fff;text-shadow:var(--outline-lg);text-wrap:balance}
#bannerSub{background:var(--paper);border:3px solid var(--ink);border-radius:5px;box-shadow:0 3px 0 var(--ink);padding:5px 12px;font-size:14px;max-width:100%;text-wrap:balance}
#banner.show #bannerMain{animation:bannerPop .5s cubic-bezier(.2,1.7,.4,1) both}
@keyframes bannerPop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* controls */
#stick{position:absolute;width:120px;height:120px;margin:-63px 0 0 -63px;border-radius:50%;background:rgba(255,250,240,.3);border:3px solid rgba(43,35,64,.35);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);transform:translate(-50%,-50%)}
#btns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:center;gap:14px}
.pad{font-family:var(--font-display);font-weight:400;color:#fff;text-shadow:var(--outline);border:4px solid var(--ink);border-radius:50%;box-shadow:0 6px 0 var(--ink);cursor:pointer;touch-action:none;display:grid;place-items:center;padding:0;line-height:1.1}
.pad.pressed{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.pad:focus-visible{outline:4px solid #fff;outline-offset:3px}
#btnBite{width:108px;height:108px;font-size:26px;background:var(--accent)}
#btnHeart{width:86px;height:86px;font-size:15px;background:var(--heart);animation:heartPulse .9s ease-in-out infinite}
@keyframes heartPulse{50%{transform:scale(1.08)}}
#hint{position:absolute;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);max-width:calc(100% - 170px);background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 3px 0 var(--ink);padding:7px 12px;font-size:13px;pointer-events:none}

/* overlays */
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(180deg,rgba(143,211,255,.1),rgba(43,35,64,.4));overflow-y:auto;touch-action:pan-y}
.panel{width:min(100%,380px);background:var(--paper);border:4px solid var(--ink);border-radius:8px;box-shadow:0 8px 0 var(--ink);padding:24px 18px 20px;display:grid;gap:14px;justify-items:center;text-align:center;position:relative}
.stamp{position:absolute;top:-17px;left:14px;background:var(--heart);color:#fff;border:3px solid var(--ink);padding:3px 10px;font-size:13px;transform:rotate(-6deg);border-radius:4px;font-family:var(--font-display);font-weight:400;text-shadow:var(--outline-sm)}
.stamp.gold{background:var(--gold);color:var(--ink);text-shadow:none}
.tiles{margin:0;display:grid;gap:7px;justify-items:center}
.tiles .row{display:flex;gap:6px}
.tiles b{display:grid;place-items:center;min-width:48px;height:48px;padding:0 6px;background:var(--c);border:3px solid var(--ink);border-radius:4px;box-shadow:0 4px 0 var(--ink);font-family:var(--font-display);font-weight:400;font-size:28px;color:var(--ink)}
.tiles b:nth-child(odd){transform:rotate(-3deg)}
.tiles b:nth-child(even){transform:rotate(2deg) translateY(2px)}
.tag{margin:0;font-size:14px;text-wrap:balance}
.how{list-style:none;margin:0;padding:11px 12px;background:var(--paper-2);border-radius:6px;display:grid;gap:7px;text-align:left;font-size:13px;width:100%}
.how li{display:flex;align-items:center;gap:10px}
.ic{flex:none;display:grid;place-items:center;min-width:46px;height:24px;padding:0 6px;border:2px solid var(--ink);border-radius:12px;font-size:11px;font-family:var(--font-display);font-weight:400;color:#fff;text-shadow:var(--outline-sm)}
.big{font-family:var(--font-display);font-weight:400;font-size:22px;color:#fff;text-shadow:var(--outline);background:var(--accent);border:4px solid var(--ink);border-radius:8px;box-shadow:0 6px 0 var(--ink);padding:10px 34px;cursor:pointer}
.big.sub{background:var(--paper);color:var(--ink);text-shadow:none;font-size:16px;padding:8px 20px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.big:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.big:disabled{opacity:.5}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.win{margin:4px 0 0;font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.2;color:var(--gold);text-shadow:var(--outline-lg);text-wrap:balance}
.ptitle{margin:4px 0 0;font-family:var(--font-display);font-weight:400;font-size:24px}
.err{margin:0;font-size:13px;color:#c0392b}
.mystats{width:100%;background:var(--paper-2);border-radius:6px;padding:9px 12px;font-size:12px;line-height:1.6;text-align:left}
.mystats b{font-family:var(--font-display);font-weight:400;font-size:15px}
.stages{display:grid;gap:10px;width:100%}
.stagebtn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px;background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:0 4px 0 var(--ink);color:var(--ink);text-align:left;cursor:pointer}
.stagebtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.stagebtn:disabled{opacity:.45;cursor:default;box-shadow:0 2px 0 var(--ink);transform:none}
.stagebtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.stagebtn .num{width:44px;height:44px;display:grid;place-items:center;background:var(--c);border:3px solid var(--ink);border-radius:4px;font-family:var(--font-display);font-weight:400;font-size:24px}
.stagebtn .nm{font-family:var(--font-display);font-weight:400;font-size:17px;display:block}
.stagebtn .sub{font-size:11px;opacity:.75;display:block;margin-top:2px}
.badge{font-size:11px;padding:3px 7px;border:2px solid var(--ink);border-radius:10px;background:var(--gold);white-space:nowrap}
.badge.go{background:var(--xp)}
.badge.lock{background:#ddd3c4}
.diff{display:grid;gap:6px;width:100%}
.diff-lbl{font-size:12px;opacity:.75}
.diff-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dbtn{padding:8px 4px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--font-display);font-weight:400;font-size:14px;cursor:pointer;opacity:.55}
.dbtn small{display:block;font-family:var(--font-body);font-weight:800;font-size:10px;margin-top:3px;opacity:.8}
.dbtn[aria-checked="true"]{opacity:1;background:var(--c);transform:translateY(-1px)}
.dbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.link{background:none;border:none;font-size:12px;color:var(--ink);opacity:.7;text-decoration:underline;cursor:pointer;padding:4px}
.link.armed{color:#c0392b;opacity:1}

@media (prefers-reduced-motion: reduce){
  #btnHeart{animation:none}
  #banner.show #bannerMain{animation:none}
}
</style>

<div id="game">
  <div id="labels" class="layer"></div>

  <div id="hud" hidden>
    <div id="bar">
      <div class="r1">
        <span class="lv">Lv<b id="lvNum">1</b><small id="lvCap">/5</small></span>
        <span id="hearts"></span>
        <span class="grow"></span>
        <span class="kids">こども<b id="kidsN">0</b></span>
        <button id="menuBtn" type="button" aria-label="メニュー">≡</button>
      </div>
      <div class="xp" id="xpBar"><i id="xpFill"></i></div>
      <div class="r3"><span id="partsRow"></span><span id="perks"></span></div>
    </div>
    <div id="bossBar" hidden><span id="bossName"></span><div class="bhp"><i id="bossFill"></i></div></div>
  </div>
  <div id="bossArrow" hidden><div class="rot"></div><div class="lbl">ボス</div></div>

  <div id="banner" hidden><div id="bannerMain"></div><div id="bannerSub"></div></div>
  <div id="stick" hidden><div id="knob"></div></div>
  <div id="hint" hidden>ゆびで なぞると うごくよ</div>

  <div id="btns" hidden>
    <button id="btnHeart" class="pad" type="button" hidden>なかよし</button>
    <button id="btnBite" class="pad" type="button">パクッ</button>
  </div>

  <div id="title" class="overlay">
    <div class="panel">
      <div class="stamp">れいわばん</div>
      <h1 class="tiles" aria-label="どうぶつ ばんちょう">
        <span class="row"><b style="--c:#ffd23f">ど</b><b style="--c:#6cc24a">う</b><b style="--c:#5aa9f5">ぶ</b><b style="--c:#ff8a7a">つ</b></span>
        <span class="row"><b style="--c:#f7aabb">ば</b><b style="--c:#ffd23f">ん</b><b style="--c:#6cc24a">ちょ</b><b style="--c:#ff9f43">う</b></span>
      </h1>
      <p class="tag">たべて そだって めざせ ばんちょう！</p>
      <ul class="how">
        <li><span class="ic" style="background:#3b8beb">ゆび</span>なぞって うごく</li>
        <li><span class="ic" style="background:var(--accent)">パクッ</span>どうぶつを かじる</li>
        <li><span class="ic" style="background:#56b84a">おにく</span>たべると レベル アップ</li>
        <li><span class="ic" style="background:var(--gold);color:var(--ink);text-shadow:none">キラキラ</span>あたま・からだ・あしが かわる</li>
        <li><span class="ic" style="background:#e8463a">あか</span>おにくが あかいのは つよい どうぶつ</li>
        <li><span class="ic" style="background:var(--heart)">♥</span>なかよしで こどもが うまれる</li>
      </ul>
      <div class="diff">
        <span class="diff-lbl">むずかしさ</span>
        <div class="diff-row" role="radiogroup" aria-label="むずかしさ" id="diffRow">
          <button class="dbtn" type="button" role="radio" data-d="easy" style="--c:#8fe06a">かんたん<small>はじめての ひと</small></button>
          <button class="dbtn" type="button" role="radio" data-d="normal" style="--c:#ffd23f">ふつう<small>なれてきたら</small></button>
          <button class="dbtn" type="button" role="radio" data-d="hard" style="--c:#ff7a7a">むずかしい<small>おとな むけ</small></button>
        </div>
      </div>
      <button id="startBtn" class="big" type="button">あそぶ</button>
      <p id="loadErr" class="err" hidden>よみこみに しっぱいしました。ページを ひらきなおしてください。</p>
    </div>
  </div>

  <div id="select" class="overlay" hidden>
    <div class="panel">
      <div class="stamp gold">ステージ</div>
      <h2 class="ptitle">どこへ いく？</h2>
      <div id="myStats" class="mystats"></div>
      <div id="stageList" class="stages"></div>
      <div class="btnrow"><button id="toTitleBtn" class="link" type="button">タイトルに もどる</button><button id="resetBtn" class="link" type="button">はじめから やりなおす</button></div>
    </div>
  </div>

  <div id="menu" class="overlay" hidden>
    <div class="panel">
      <h2 class="ptitle">ひとやすみ</h2>
      <div class="btnrow">
        <button id="resumeBtn" class="big" type="button">つづける</button>
        <button id="menuSelectBtn" class="big sub" type="button">ステージを えらぶ</button>
      </div>
      <button id="soundBtn" class="big sub" type="button">おと：あり</button>
    </div>
  </div>

  <div id="clear" class="overlay" hidden>
    <div class="panel">
      <div class="stamp gold">クリア</div>
      <h2 id="clearTitle" class="win">ステージ クリア！</h2>
      <p id="clearMsg" class="tag"></p>
      <div class="btnrow">
        <button id="nextBtn" class="big" type="button">つぎの ステージへ</button>
        <button id="clearSelectBtn" class="big sub" type="button">ステージを えらぶ</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const gameEl=$('game');
if(!window.THREE){ $('loadErr').hidden=false; $('startBtn').disabled=true; return; }

const TAU=Math.PI*2;
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=11; const rnd=()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renderer ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
gameEl.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#8fd3ff');
scene.fog=new THREE.Fog('#8fd3ff',46,95);
const camera=new THREE.PerspectiveCamera(45,1,0.1,220);
const hemi=new THREE.HemisphereLight(0xe4f6ff,0x5d8f3a,0.78); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2da,0.82);
sun.castShadow=true; sun.shadow.mapSize.set(1536,1536);
const sc=sun.shadow.camera; sc.left=-23; sc.right=23; sc.top=23; sc.bottom=-23; sc.near=1; sc.far=70;
sun.shadow.bias=-0.0008;
scene.add(sun); scene.add(sun.target);
function resize(){ const w=gameEl.clientWidth||window.innerWidth, h=gameEl.clientHeight||window.innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();

/* ---------- blocks & palettes ---------- */
const G=new THREE.BoxGeometry(1,1,1);
const matCache={};
function mat(c){ return matCache[c]||(matCache[c]=new THREE.MeshLambertMaterial({color:c})); }
let PAL=null; const palCache={};
function pal(c){
  if(!PAL) return c;
  const k=PAL+c; if(palCache[k]) return palCache[k];
  const col=new THREE.Color(c), h={}; col.getHSL(h);
  if(PAL==='white') col.setHSL(h.h,h.s*0.08,0.84+h.l*0.13);
  else if(PAL==='gold') col.setHSL(0.12,0.92,0.42+h.l*0.4);
  return palCache[k]='#'+col.getHexString();

function assemble(cfg,opt){
  opt=opt||{}; PAL=opt.pal||null;
  if(SP[cfg.head].custom){ const r=SP[cfg.head].custom(opt); PAL=null; return r; }
  const H=SP[cfg.head].head, B=SP[cfg.body].body, Lg=SP[cfg.legs].legs;
  const root=new THREE.Group(), rig=new THREE.Group(); root.add(rig);
  const [bw,bh,bd]=B.size, L=Lg.len, lw=Math.min(Lg.w,bw/2-0.04);
  const bodyY=L+bh/2;
  bx(rig,B.c,bw,bh,bd,0,bodyY,0);
  if(B.x) B.x(rig,bodyY,B.size);
  const [hw,hh,hd]=H.size, head=new THREE.Group();
  head.position.set(0,bodyY+bh*0.3+H.lift,bd/2+hd*0.32); rig.add(head);
  bx(head,H.c,hw,hh,hd,0,0,0);
  const es=opt.eye||1, ex=hw*0.27, ey=H.eyeY, ez=hd/2;
  for(const s of (H.noEyes?[]:[-1,1])){
    bxr(head,'#ffffff',0.17*es,0.2*es,0.04,s*ex,ey,ez+0.01);
    bxr(head,'#1e1a2b',0.1*es,0.14*es,0.04,s*(ex-0.025*es),ey-0.02*es,ez+0.03);
    bxr(head,'#ffffff',0.035*es,0.035*es,0.03,s*(ex-0.045*es),ey+0.025*es,ez+0.05);
    if(opt.boss){ const b=bxr(head,'#3a3450',0.24*es,0.07*es,0.05,s*ex,ey+0.14*es,ez+0.06); b.rotation.z=s*0.35; }
  }
  if(H.x) H.x(head,H.size);
  const legs=[];
  for(const [sx,sz] of [[-1,1],[1,1],[-1,-1],[1,-1]]){
    const piv=new THREE.Group(); piv.position.set(sx*(bw/2-lw/2-0.03),L,sz*(bd/2-lw/2-0.06)); rig.add(piv);
    bx(piv,Lg.c,lw,L+0.02,lw,0,-L/2,0);
    if(Lg.foot) bx(piv,Lg.c,lw+0.04,0.06,lw+0.18,0,-L+0.03,0.08);
    legs.push(piv);
  }
  PAL=null;
  return {root,rig,head,legs,headZ:head.position.z};
}
function buildBody(cfg,scale,opt){

}

let ac=null, soundOn=true;
function ensureAudio(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; } }
  if(ac&&ac.state==='suspended') ac.resume();
}
function tone(f,dur,type,f2,vol,delay){
  if(!ac||!soundOn) return;
  const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||0.1,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.03);
}
let noiseBuf=null;
function noise(dur,f0,f1,q,vol,delay){
  if(!ac||!soundOn) return;
  if(!noiseBuf){ noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*0.8),ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t=ac.currentTime+(delay||0), s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf; f.type='bandpass'; f.Q.value=q||1; f.frequency.setValueAtTime(f0,t); if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur);

  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t+dur+0.02);
}

}

function animBody(o,dt,spd){

  p.rig.position.y=moving?Math.abs(Math.sin(o.walkT))*0.09:Math.sin(perf*2.2+o.walkT)*0.012;
  if(o.biteT>0){ o.biteT-=dt; const t=Math.max(0,o.biteT)/o.biteDur, s=Math.sin((1-t)*Math.PI); p.head.position.z=p.headZ+s*0.32; p.head.rotation.x=-s*0.3; p.rig.position.y+=s*0.12; }

  if(o.squashT>0){ o.squashT-=dt; const t=Math.max(0,o.squashT)/0.25; p.rig.scale.set(1+0.22*t,1-0.28*t,1+0.22*t); } else p.rig.scale.set(1,1,1);

function chompBox(p,m,w,h,x,y){ const b=new THREE.Mesh(G,m); b.scale.set(w,h,0.1); b.position.set(x,y,0); b.renderOrder=20; p.add(b); }

function updChomps(dt){

    kx:0,kz:0,walkT:R(0,6),biteT:0,biteDur:0.25,squashT:0,attackCd:0,angryT:0,fleeT:0,windup:0,wt:R(0,2),walking:false,tx:0,tz:0,
    leaving:false,leaveT:0,nakayoshi:false,loving:0,heartT:0,spawnT:0.35,goldT:0,
    wanderSpd:1.3,fleeSpd:3.2,chaseSpd:(2.9+sp.lv*0.04)*D.chase};

}
function spawnNPC(kind,opt){
  opt=opt||{};
  let x=0,z=0;
  for(let k=0;k<40;k++){
    const ang=R(0,TAU), r=R(3,ISL-2); x=Math.cos(ang)*r; z=Math.sin(ang)*r;
    const dp=Math.hypot(x-player.x,z-player.z);
    if(dp<(opt.minD||9)||dp>(opt.maxD||60)) continue;
    if(obstacles.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+1.2)) continue;
    break;
  }
  const a=makeAnimal(kind,Object.assign({},opt,{x,z}));

}

/* ---------- actions ---------- */
function hitAnimal(a,by,power){
  if(a.meat<=0||a.leaving) return;
  if(a.isBoss){
    const bx0=by.x-a.x, bz0=by.z-a.z, bd0=Math.hypot(bx0,bz0)||1;
    const bounce=s=>{ if(by===player){ player.kx=bx0/bd0*s; player.kz=bz0/bd0*s; player.squashT=0.2; } else { by.x+=bx0/bd0*s*0.15; by.z+=bz0/bd0*s*0.15; } };
    if(a.guardT>0){
      bounce(11); burst(a.x,a.height*0.6,a.z,'#bfe9ff',8,2.5,0.16,0.5,3);
      popText('カキーン！',a.x,a.height+0.2,a.z,'alert'); sfx.clank(); return;
    }
    bounce(7);
  }
  const n=Math.min(power||1,a.isBoss?2:99,a.meat);
  a.squashT=0.25;
  const dx=a.x-by.x, dz=a.z-by.z, d=Math.hypot(dx,dz)||1, kn=a.isBoss?1.5:4;
  a.kx+=dx/d*kn; a.kz+=dz/d*kn;
  for(let i=0;i<n;i++){
    a.meat--;
    const col=a.isBoss?RAINBOW[a.meat%6]:rowColor(a);
    let part=null;
    if(a.meat===0&&!a.isBoss&&(a.gold||a.nushi||a.lv>=player.lv-1)) part=pick(['head','body','legs']);
    dropMeat(a.x,a.z,{lv:a.lv,color:col,part,species:a.kind,gold:a.gold,boss:a.isBoss});
  }
  if(a.nushi&&a.meat===0) for(let i=0;i<3;i++) dropMeat(a.x,a.z,{lv:a.lv,color:rowColor(a),species:a.kind});
  burst(a.x,a.height*0.6,a.z,a.isBoss?pick(RAINBOW):rowColor(a),10,3,0.15,0.5,3.5);
  if(by===player){
    popText(n>1?`ガブッ ×${n}`:'ガブッ！',a.x,a.height+0.25,a.z,'gabu',R(-12,12));
    sfx.bite(); spawnChomp(a); flashWhite(a,0.1);
    hitStop=a.isBoss?0.09:0.06;
    if(!reduceMotion) shake=Math.max(shake,0.2);
  } else { popText('パクッ',a.x,a.height+0.2,a.z,'small'); sfx.nibble(); flashWhite(a,0.06); }
  setMeatRow(a);
  if(a.isBoss&&a.meat>0){
    a.lost+=n;
    if(a.lost>=D.guard){ a.lost=0; a.guardT=3; popText('まもりの ポーズ！',a.x,a.height+0.7,a.z,'small'); sfx.clank(); }
    renderBossBar();
  }
  if(a.meat<=0){
    if(a.isBoss) bossDefeated(a);
    else { a.leaving=true; a.leaveT=0; a.row.visible=false; popText('にげた〜',a.x,a.height+0.6,a.z,'small'); }
  } else if(!a.isBoss&&!a.gold){
    if(a.lv<player.lv-1) a.fleeT=4; else a.angryT=7;
  }
}
function playerBite(){
  if(mode!=='play'||paused||player.biteCd>0||player.loveT>0||player.air||player.twist) return;
  player.biteCd=0.3; player.biteT=player.biteDur;
  let best=null, bd=1e9;
  for(const a of animals){
    if(a.nakayoshi||a.leaving||a.loving>0||a.meat<=0||a.twist) continue;
    const d=Math.hypot(a.x-player.x,a.z-player.z), reach=player.rad+a.rad+0.95;
    if(d<reach&&d<bd){ bd=d; best=a; }
  }
  if(best){
    player.heading=Math.atan2(best.x-player.x,best.z-player.z);
    hitAnimal(best,player,player.bite);
    player.lastTarget=best; player.lastTargetT=8;
  } else sfx.miss();
}
function heal(n){
  if(player.hp>=player.maxHp) return false;
  player.hp=Math.min(player.maxHp,player.hp+n); popText('♥',player.x+0.6,player.height+0.1,player.z,'heal'); return true;
}
function eatMeat(m){
  sfx.eat();
  burst(player.x,player.height*0.7,player.z,shade(m.color,0.95),5,1.5,0.1,0.4,2);
  const yum=stage().terrain==='moon'?'もちもち':'もぐもぐ';
  if(m.boss){ heal(1); popText(yum,player.x,player.height+0.3,player.z,'eat'); }
  else {
    if(player.lv<cap()){
      const ex=Math.max(1,Math.round((m.gold?5:clamp(m.lv-player.lv+2,1,4))*D.exp));
      popText(`${yum} +${ex}`,player.x,player.height+0.3,player.z,'eat');
      addExp(ex);
    } else popText(yum,player.x,player.height+0.3,player.z,'eat');
    if(m.lv<player.lv) heal(1);

function addExp(n){

  if(!up) return;
  applyStats(true); refreshRows(); kids.forEach(kidBody);
  sfx.level();
  burst(player.x,player.height*0.5,player.z,'#a6f07f',18,3,0.2,0.7,5);
  burst(player.x,player.height*0.5,player.z,'#ffffff',12,3,0.2,0.7,5);

function respawn(){

function renderHUD(){

  $('lvNum').textContent=player.lv;

function stepPlayer(dt,ix,iz,il){
  player.invuln-=dt; player.biteCd-=dt; player.lastTargetT-=dt; player.loveT-=dt; player.padCd-=dt; player.twistCd-=dt; player.slipMsg-=dt;
  const P=player.parts;
  if(player.twist){
    const w=player.twist; w.t+=dt; w.ang+=dt*9;
    player.x=w.tw.x+Math.cos(w.ang)*0.9; player.z=w.tw.z+Math.sin(w.ang)*0.9; player.heading+=dt*14;
    const lift=Math.min(2.2,w.t*2.2);
    animBody(player,dt,0); P.root.position.y=lift; P.root.visible=true;
    if(w.t>1.1){ player.twist=null; player.twistCd=2.2; player.air={t:0,dur:0.8,h:1.0,y0:lift,vx:Math.cos(w.ang)*9,vz:Math.sin(w.ang)*9}; }
    return;
  }
  if(player.air){
    const A=player.air; A.t+=dt; const u=Math.min(1,A.t/A.dur);
    player.x+=A.vx*dt; player.z+=A.vz*dt;
    const d=Math.hypot(player.x,player.z), lim=ISL-0.9; if(d>lim){ player.x*=lim/d; player.z*=lim/d; }
    animBody(player,dt,0);
    P.root.position.y=A.y0*(1-u)+Math.sin(u*Math.PI)*A.h; P.rig.rotation.x=-0.3*Math.cos(u*Math.PI); P.root.visible=true;
    if(u>=1){ player.air=null; player.padCd=0.35; player.squashT=0.22; P.root.position.y=0; burst(player.x,0.2,player.z,dustCol(),10,2.5,0.2,0.4,1.5); collide(player,player.rad); }
    return;
  }
  if(player.slipT>0){
    player.slipT-=dt; player.heading+=dt*16;
    player.x+=player.svx*dt; player.z+=player.svz*dt; const sd=Math.exp(-dt*1.5); player.svx*=sd; player.svz*=sd;
    collide(player,player.rad); animBody(player,dt,0);
    P.rig.rotation.z=player.slipT>0?Math.sin(perf*22)*0.25:0; P.root.visible=true;
    return;
  }
  const play=mode==='play'&&player.loveT<=0, st=stage(), body=SP[player.cfg.body];
  let spd=0, tvx=0, tvz=0, mul=1;
  if(play&&world&&world.river&&body.terrain!=='jungle'&&Math.abs(player.z-world.river.z0)<world.river.hw&&Math.hypot(player.x,player.z)<ISL){
    mul=0.7; player.x+=2.8*dt;
    if(Math.random()<dt*8) burst(player.x+R(-0.4,0.4),0.15,player.z+R(-0.4,0.4),'#e8fbff',1,0.6,0.12,0.4,1);
    if(player.slipMsg<=0){ player.slipMsg=3; popText('ながされる〜',player.x,player.height+0.5,player.z,'small'); }
  }
  if(play&&world&&st.terrain==='desert'&&body.terrain!=='desert'){
    for(const p of world.pits){
      const dx=p.x-player.x, dz=p.z-player.z, d=Math.hypot(dx,dz);
      if(d<p.r){
        mul=0.55; if(d>0.3){ player.x+=dx/d*1.5*dt; player.z+=dz/d*1.5*dt; }
        if(Math.random()<dt*6) burst(player.x+R(-0.5,0.5),0.15,player.z+R(-0.5,0.5),'#b58c48',1,0.5,0.14,0.4,0.8);
        if(player.slipMsg<=0){ player.slipMsg=3; popText('ずるずる〜',player.x,player.height+0.5,player.z,'small'); }
      }
    }
  }
  if(play&&il>0.08){
    const v=player.spd*Math.min(1,il*1.3)*mul;
    tvx=ix/il*v; tvz=iz/il*v; turnTo(player,Math.atan2(ix,iz),dt,12); spd=v;
    if(!movedOnce){ movedOnce=true; $('hint').hidden=true; }
  }
  const onIce=play&&world&&st.terrain==='snow'&&body.terrain!=='snow'&&world.ice.some(p=>Math.hypot(p.x-player.x,p.z-player.z)<p.r);
  const tr=Math.min(1,(onIce?1.8:30)*dt);
  player.vx+=(tvx-player.vx)*tr; player.vz+=(tvz-player.vz)*tr;
  if(onIce&&Math.hypot(player.vx,player.vz)>1.5&&player.slipMsg<=0){ player.slipMsg=4; popText('つるつる〜',player.x,player.height+0.5,player.z,'small'); }
  player.x+=player.vx*dt; player.z+=player.vz*dt;
  player.x+=player.kx*dt; player.z+=player.kz*dt; const kd=Math.exp(-dt*6); player.kx*=kd; player.kz*=kd;
  collide(player,player.rad);
  animBody(player,dt,onIce?spd*0.4:spd);
  P.root.visible=!(player.invuln>0&&mode==='play'&&Math.floor(perf*14)%2===0);
  if(play&&world&&player.padCd<=0){
    for(const pad of world.pads){
      if(Math.hypot(pad.x-player.x,pad.z-player.z)<pad.r){
        const sp=pad.moon?7:8;
        player.air={t:0,dur:pad.moon?1.5:0.95,h:pad.moon?5:3.2,y0:0,vx:Math.sin(player.heading)*sp,vz:Math.cos(player.heading)*sp};
        player.vx=player.vz=0; pad.sq=0.4; sfx.boing();
        popText(pad.moon?'ぴょーーん！':'ぽよーん！',player.x,player.height+0.6,player.z,'eat');
        break;
      }
    }
  }
  if(play&&world&&!player.air&&body.terrain!=='jungle'){
    for(const pe of world.peels){
      if(pe.active&&Math.hypot(pe.x-player.x,pe.z-player.z)<0.45+player.rad*0.5){
        pe.active=false; pe.g.visible=false; pe.t=8;
        const v=Math.max(4,Math.hypot(player.vx,player.vz)*1.4), h=player.heading;
        player.svx=Math.sin(h)*v; player.svz=Math.cos(h)*v; player.vx=player.vz=0; player.slipT=0.9;
        popText('すってん！',player.x,player.height+0.6,player.z,'alert'); sfx.whirl();
        break;
      }
    }
  }
}

function makeTornado(x,z){
  const g=new THREE.Group(), m1=new THREE.MeshLambertMaterial({color:'#e3c27f',transparent:true,opacity:0.55,depthWrite:false}), m2=new THREE.MeshLambertMaterial({color:'#c9a159',transparent:true,opacity:0.6,depthWrite:false});
  const layers=[];
  for(let i=0;i<6;i++){ const s=0.5+i*0.34, m=new THREE.Mesh(G,i%2?m1:m2); m.scale.set(s,0.55,s); m.position.y=0.3+i*0.5; g.add(m); layers.push(m); }

function clearGimmicks(){

function spawnSnowball(){

  const d=Math.hypot(sx,sz), lim=ISL-1.5; if(d>lim){ sx*=lim/d; sz*=lim/d; }
  const tx=player.x+R(-2,2), tz=player.z+R(-2,2), dx=tx-sx, dz=tz-sz, dd=Math.hypot(dx,dz)||1;
  const g=new THREE.Group(), inner=new THREE.Group(); g.add(inner);
  const b1=bxr(inner,'#ffffff',1.4,1.4,1.4,0,0,0); const b2=bxr(inner,'#e6f0f8',1.25,1.25,1.25,0,0,0); b2.rotation.set(0.7,0.7,0);
  b1.castShadow=b2.castShadow=true;
  g.position.set(sx,0.8,sz); scene.add(g);
  snowballs.push({g,inner,x:sx,z:sz,vx:dx/dd*6.5,vz:dz/dd*6.5,t:0,hit:new Set()});

function knockAnimal(a,vx,vz,k){

}
function updateGimmicks(dt){

  if(st.terrain==='snow'&&pl){ gimT-=dt; if(gimT<=0){ gimT=R(6,9); spawnSnowball(); } }

      sb.hit.add(player);

  }

      popText('くるくる〜',player.x,player.height+0.6,player.z,'eat'); sfx.whirl();
    }
    for(const a of animals){
      if(a.isBoss||a.leaving||a.twist||a.nakayoshi||a.loving>0||(a.twistCd||0)>0) continue;
      if(Math.hypot(a.x-tw.x,a.z-tw.z)<tw.r) a.twist={tw,t:0,ang:Math.atan2(a.z-tw.z,a.x-tw.x)};
    }
  }
  if(world) for(const pad of world.pads){ if(!pad.cap) continue; pad.sq=Math.max(0,pad.sq-dt*1.6); const q=Math.sin(pad.sq/0.4*Math.PI)*pad.sq; pad.cap.scale.set(1+q*0.8,1-q*1.4,1+q*0.8); }
  if(world) for(const pe of world.peels){
    if(pe.active) continue; pe.t-=dt;
    if(pe.t<=0){
      for(let k=0;k<20;k++){ const a=R(0,TAU), r=R(3,ISL-2), x=Math.cos(a)*r, z=Math.sin(a)*r;
        if(Math.hypot(x-player.x,z-player.z)<5||(world.river&&Math.abs(z-world.river.z0)<world.river.hw+0.8)||obstacles.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+0.6)) continue;
        pe.x=x; pe.z=z; break; }

  for(let i=meteors.length-1;i>=0;i--){

      for(const a of animals){ if(a.isBoss||a.leaving||a.twist) continue; const d=Math.hypot(a.x-m.x,a.z-m.z); if(d<3.8) knockAnimal(a,a.x-m.x||0.1,a.z-m.z,9); }

function wander(a){

function updateNPCs(dt){

      continue;
    }
    a.attackCd-=dt; a.angryT-=dt; a.fleeT-=dt; a.wt-=dt;
    const dx=player.x-a.x, dz=player.z-a.z, d=Math.hypot(dx,dz)||0.001, diff=a.lv-player.lv;
    let dirx=0,dirz=0,spd=0,chasing=false,busy=false;

      if(a.heartT<=0){ a.heartT=0.12; burst((a.x+player.x)/2,a.height+0.2,(a.z+player.z)/2,'#ff6f9c',2,0.8,0.16,0.9,1.2,-2.5); }
      if(a.loving<=0) finishLove(a);
    } else if(a.isBoss){
      if(pl) chasing=true;
    } else if(a.gold){

const arrowEl=$('bossArrow'), arrowRot=arrowEl.querySelector('.rot'), arrowLbl=arrowEl.querySelector('.lbl');
function updateBossArrow(){

  v3.set(boss.x,boss.height*0.6,boss.z).project(camera);

function updateKids(dt){

    let gx,gz,reach=0.3,attacking=false;

function separate(){
  const B=(player.air||player.twist)?[]:[player];
  for(const a of animals) if(!a.leaving&&!a.twist) B.push(a);
  for(const k of kids) B.push(k);
  for(let i=0;i<B.length;i++) for(let j=i+1;j<B.length;j++){
    const a=B[i], b=B[j];
    if(a===player&&b.isKid) continue;
    const dx=b.x-a.x, dz=b.z-a.z, d=Math.hypot(dx,dz), m=a.rad+b.rad;
    if(d<m&&d>1e-4){
      const push=m-d, wa=(b.rad*b.rad)/(a.rad*a.rad+b.rad*b.rad);

  }

function updateWorld(dt){

    const dz=p.z-player.z, dx=Math.abs(p.x-player.x);
    const hide=fade&&dz>-0.4&&dz<5.2&&dx<p.hw+1.1;
    const t=hide?0.2:1;
    if(Math.abs(t-p.op)>0.005){ p.op+=(t-p.op)*Math.min(1,dt*9); for(const m of p.mats){ m.opacity=p.op; m.depthWrite=p.op>0.9; } }
  }
  for(const f of world.flakes){
    f.m.position.y-=f.sp*dt; f.m.position.x+=Math.sin(perf*1.5+f.ph)*dt*0.4;
    if(f.m.position.y<0){ f.m.position.set(camLook.x+R(-11,11),R(7,11),camLook.z+R(-9,9)); }
  }
  for(const c of world.clouds){ c.position.x+=dt*0.6; if(c.position.x>55) c.position.x=-55; }
  for(const m of world.flow){ m.position.x+=dt*2.8; const lim=Math.sqrt(Math.max(0,ISL*ISL-m.position.z*m.position.z)); if(m.position.x>lim) m.position.x=-lim; }
}
const camPos=new THREE.Vector3(0,12,14), camLook=new THREE.Vector3(), camTarget=new THREE.Vector3(), lookTarget=new THREE.Vector3();
function updateCamera(dt){
  const portrait=camera.aspect<0.85;
  const zoom=(portrait?1.3:1)*(1+(player.scale-0.85)*0.45)*(boss?1.15:1);
  if(mode==='title'){ const t=perf*0.1; camTarget.set(player.x+Math.sin(t)*18,14,player.z+Math.cos(t)*18); }
  else camTarget.set(player.x,15.5*zoom,player.z+12.8*zoom);
  camPos.lerp(camTarget,1-Math.exp(-dt*(mode==='title'?2:5)));
  camLook.lerp(lookTarget.set(player.x,0.5,player.z),1-Math.exp(-dt*8));
  camera.position.copy(camPos);
  if(shake>0){ shake=Math.max(0,shake-dt); camera.position.x+=R(-1,1)*shake*0.6; camera.position.y+=R(-1,1)*shake*0.4; }
  camera.lookAt(camLook);
  sun.position.set(player.x+8,18,player.z+6); sun.target.position.set(player.x,0,player.z);
}
function update(dt){
  if(paused){ updateCamera(0); return; }
  if(hitStop>0){ hitStop-=dt; updChomps(dt); return; }
  perf+=dt;
  if(tipT>0&&mode==='play'){ tipT-=dt; if(tipT<=0){ const st=stage(); banner(st.tipMain,st.tip,2.8); } }
  let ix=0, iz=0;
  if(stick.active){ ix=stick.x; iz=stick.y; }
  if(keys.left) ix-=1; if(keys.right) ix+=1; if(keys.up) iz-=1; if(keys.down) iz+=1;
  let il=Math.hypot(ix,iz); if(il>1){ ix/=il; iz/=il; il=1; }

  if(mode==='play'||mode==='title') stepPlayer(dt,mode==='play'?ix:0,mode==='play'?iz:0,mode==='play'?il:0);
  else if(mode==='down'){
    modeT+=dt; animBody(player,dt,0); player.parts.root.visible=true;
    player.parts.rig.rotation.z=Math.min(1.5,modeT*7);
    if(modeT>2) respawn();
  } else if(mode==='clear'){
    modeT+=dt; animBody(player,dt,0); player.parts.root.visible=true;
    turnTo(player,0,dt,4);
    player.parts.rig.position.y=Math.abs(Math.sin(modeT*5))*0.6;
    if(modeT<3.5&&Math.random()<dt*16) burst(player.x+R(-3,3),R(3,5),player.z+R(-3,3),pick(RAINBOW),3,1.2,0.16,1.6,0.5,3);
    if(modeT>2.4&&$('clear').hidden) showClear();
  }

  updateNPCs(dt);
  updateKids(dt);
  updateGimmicks(dt);
  separate();
  updChomps(dt);
  updateMeats(dt);
  updParts(dt);
  spawner(dt);
  updateEvent(dt);

  for(const a of animals){
    const yaw=Math.atan2(camera.position.x-a.x,camera.position.z-a.z);
    if(a.row){ a.row.position.set(a.x,a.height+0.42,a.z); a.row.rotation.y=yaw; }
    if(a.heart){ a.heart.position.set(a.x,a.height+0.55+Math.sin(perf*4)*0.1,a.z); a.heart.rotation.y=yaw; a.heart.scale.setScalar(1+Math.sin(perf*8)*0.08); }
  }

  let nn=null;
  if(mode==='play'&&player.loveT<=0){
    for(const a of animals) if(a.nakayoshi&&Math.hypot(a.x-player.x,a.z-player.z)<player.rad+a.rad+1.8){ nn=a; break; }
  }
  if(nn!==nearNaka){ nearNaka=nn; $('btnHeart').hidden=!nn; }

  updateCamera(dt);
  updateWorld(dt);
  updWaves(dt);
  updShots(dt);
  updateBossArrow();
  updPops(dt);
  if(bannerT>0){ bannerT-=dt; if(bannerT<=0) bannerEl.hidden=true; }
}

/* ---------- flow ---------- */
function hideOverlays(){ ['title','select','menu','clear'].forEach(id=>$(id).hidden=true); }
function loadStage(i){
  stageIdx=i; const st=STAGES[i];
  [...animals].forEach(removeAnimal);
  kids.forEach(k=>scene.remove(k.parts.root)); kids=[];
  meats.forEach(m=>scene.remove(m.g)); meats=[];
  clearPops(); bannerT=0; bannerEl.hidden=true;
  waves.forEach(w=>{ scene.remove(w.mesh); w.m.dispose(); }); waves.length=0;
  chomps.forEach(c=>scene.remove(c.g)); chomps.length=0; hitStop=0; tipT=0; gimT=8;
  clearGimmicks();
  arrowEl.hidden=true; $('bossBar').hidden=true;
  boss=null; ev=null; bossT=-1; stageDone=false; nakaT=8; evT=R(30,45); evCount=0; spawnT=0;
  buildWorld(st);
  Object.assign(player,{x:0,z:0,heading:0,kx:0,kz:0,vx:0,vz:0,air:null,twist:null,slipT:0,padCd:0,twistCd:0,slipMsg:0,invuln:0,loveT:0,lastTarget:null,biteCd:0});
  if(st.terrain==='desert') for(let k=0;k<2;k++){ const a=R(0,TAU), r=R(9,ISL-4); tornadoes.push(makeTornado(Math.cos(a)*r,Math.sin(a)*r)); }
  applyStats(true);
  if(player.parts) player.parts.rig.rotation.z=0;
  save.kids.forEach((cfg,j)=>addKid(cfg,(j-1)*1.3,1.6,true));
  for(let k=0;k<8;k++) spawnNPC(pickSpecies(),{minD:7});
  if(player.lv>=st.cap) bossT=12;
  camPos.set(player.x,13,player.z+12);
}
function beginPlay(){
  mode='play'; paused=false; hideOverlays(); resetStick();
  $('hud').hidden=false; $('btns').hidden=false; $('hint').hidden=movedOnce;
  renderHUD();
  const st=stage();
  banner(`ステージ ${st.id}　${st.name}`,player.lv>=st.cap?'もう つよい！ ボスが まってるぞ':`Lv ${st.cap} まで そだてて ボスを たおそう`,2.8);
  tipT=3.2;
}
function startStage(i){ ensureAudio(); loadStage(i); beginPlay(); }
function showSelect(){
  mode='title'; paused=false; resetStick(); hideOverlays();
  $('hud').hidden=true; $('btns').hidden=true; $('hint').hidden=true; bannerEl.hidden=true; bannerT=0;
  renderSelect(); $('select').hidden=false;
}
function showClear(){
  const last=stageIdx+1>=STAGES.length;
  $('clearTitle').textContent=last?'ぜんぶ クリア！':'ステージ クリア！';
  $('clearMsg').textContent=last?'どうぶつ ばんちょうに なった！ きみが いちばん つよい！':`つぎは ステージ ${stageIdx+2}「${STAGES[stageIdx+1].name}」だよ`;
  $('nextBtn').hidden=last;
  $('btns').hidden=true; $('clear').hidden=false;
}
$('startBtn').addEventListener('click',()=>{ ensureAudio(); showSelect(); });
function renderDiff(){ document.querySelectorAll('#diffRow .dbtn').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.d===save.diff))); }
$('diffRow').addEventListener('click',e=>{
  const b=e.target.closest('.dbtn'); if(!b) return;
  save.diff=b.dataset.d; D=DIFFS[save.diff]; persist(); renderDiff(); ensureAudio(); sfx.part();
});
renderDiff();
$('toTitleBtn').addEventListener('click',()=>{ hideOverlays(); renderDiff(); $('title').hidden=false; });
$('stageList').addEventListener('click',e=>{ const b=e.target.closest('.stagebtn'); if(!b||b.disabled) return; startStage(+b.dataset.i); });
$('menuBtn').addEventListener('click',()=>{ if(mode!=='play') return; paused=true; resetStick(); $('menu').hidden=false; });
$('resumeBtn').addEventListener('click',()=>{ paused=false; $('menu').hidden=true; });
$('menuSelectBtn').addEventListener('click',()=>{ persist(); showSelect(); });
$('nextBtn').addEventListener('click',()=>startStage(stageIdx+1));
$('clearSelectBtn').addEventListener('click',showSelect);
let resetArmed=0;
$('resetBtn').addEventListener('click',()=>{
  const btn=$('resetBtn');
  if(!resetArmed){ resetArmed=setTimeout(()=>{ resetArmed=0; btn.textContent='はじめから やりなおす'; btn.classList.remove('armed'); },4000); btn.textContent='ほんとうに けす？ もういちど おしてね'; btn.classList.add('armed'); return; }
  clearTimeout(resetArmed); resetArmed=0; btn.textContent='はじめから やりなおす'; btn.classList.remove('armed');
  const keepDiff=save.diff; save=defaultSave(); save.diff=keepDiff; player.cfg=Object.assign({},save.parts); player.lv=1; player.exp=0;
  kids.forEach(k=>scene.remove(k.parts.root)); kids=[];
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  loadStage(0); mode='title'; renderSelect();
});

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now;
  update(dt); renderer.render(scene,camera);
}
function start(data){
  const resume=data&&data.playing&&typeof data.stage==='number'&&data.stage<save.unlocked;
  loadStage(resume?data.stage:Math.min(save.unlocked-1,STAGES.length-1));
  if(resume) beginPlay();
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({playing:mode==='play'&&!stageDone,stage:stageIdx}));
if(hot&&hot.ready) hot.ready(start); else start((hot&&hot.data)||{});
})();
</script>
