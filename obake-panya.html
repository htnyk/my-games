  :root {

  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  #stage { width: 100%; height: 100%; display: block; touch-action: none; }
  text { font-family: 'Kiwi Maru', 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif; }
  .a { transform-box: fill-box; transform-origin: center; }
  .tap { cursor: pointer; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .9; transform: scale(1.06); } }
  .float { animation: float 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  #hand { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .pulse, .float { animation: none; } }

    <text id="setText" x="180" y="200" text-anchor="middle" font-size="38" fill="#FFE7B8"></text>
    <g id="setGhosts"></g>
    <g id="contBtn" class="tap">
      <rect x="85" y="400" width="190" height="70" rx="35" fill="#FFB547" stroke="#2A1B47" stroke-width="3"/>
      <text id="contText" x="180" y="446" text-anchor="middle" font-size="28" fill="#2A1B47"></text>
    </g>
    <g id="stopBtn" class="tap">
      <rect x="110" y="496" width="140" height="54" rx="27" fill="none" stroke="#FFE7B8" stroke-width="3"/>
      <text id="stopText" x="180" y="532" text-anchor="middle" font-size="22" fill="#FFE7B8"></text>
    </g>
  </g>

  <!-- おしまい -->
  <g id="endScreen" class="tap" style="display:none">
    <rect x="-400" y="-200" width="1160" height="1040" fill="#2A1B47" opacity=".9"/>
    <text id="clearText" x="180" y="250" text-anchor="middle" font-size="46" fill="#FFE7B8"></text>
    <g id="againBtn">
      <rect x="85" y="400" width="190" height="70" rx="35" fill="#FFB547" stroke="#2A1B47" stroke-width="3"/>
      <text id="againText" x="180" y="446" text-anchor="middle" font-size="28" fill="#2A1B47"></text>
    </g>
  </g>
</svg>

<script>
(() => {
  const DATA = JSON.parse(document.getElementById('game-data').textContent);
  const S = DATA.style, T = DATA.text;
  const P = {}; for (const k in DATA.places) P[k] = { x: DATA.places[k][0], y: DATA.places[k][1] };
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const svg = $('stage');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const byId = (list, id) => list.find(x => x.id === id);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const SC = 1.25; // パンの絵の拡大率
  // オーブンの部品の位置(絵と対応)
  const OV = { door: { x: 290, y: 386 }, knob: { x: 312, y: 378 }, btn: { x: 268, y: 378 }, lever: { x: 346, y: 290 }, leverDown: { x: 346, y: 352 }, body: { x: 290, y: 330 } };
  const toB = p => ({ x: (p.x - P.home.x) / SC, y: (p.y - P.home.y) / SC });
  const toS = b => ({ x: P.home.x + b.x * SC, y: P.home.y + b.y * SC });

  function el(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const clear = g => { while (g.firstChild) g.removeChild(g.firstChild); };
  function anim(node, frames, opts) {
    node.getAnimations().forEach(a => a.cancel());
    // 透明度を指定しないアニメは必ず「見える」状態にする(消えたままになるのを防ぐ)
    frames = frames.map(f => ('opacity' in f) ? f : Object.assign({}, f, { opacity: 1 }));
    return node.animate(frames, Object.assign({ fill: 'forwards' }, opts)).finished;
  }
  const show = (id, on) => $(id).style.display = on ? '' : 'none';
  const raise = node => node.parentNode.insertBefore(node, $('fx'));
  const setPos = (node, p) => node.setAttribute('transform', `translate(${p.x},${p.y})`);
  function svgPt(e) {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const r = p.matrixTransform(svg.getScreenCTM().inverse());
    return { x: r.x, y: r.y };
  }

  /* ---------------- 注文リスト(3周・周ごとにパンが入れかわる) ---------------- */
  const COLS = DATA.perSet || 5, SETS = DATA.sets;
  const ALL_CUSTOMERS = DATA.customers.concat(DATA.specialCustomers || []);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  // 1セット5人。パンはセットごとにランダム(セット内でかぶらない)。ゾンビ夫婦はときどき来る
  function makeOrders() {
    const normal = DATA.breads.filter(b => !b.special);
    const out = []; let zombieSeen = false;
    for (let set = 0; set < SETS; set++) {
      const pool = shuffle(normal.slice());
      const guests = shuffle(DATA.customers.slice()).slice(0, COLS);
      let z = -1;
      if (DATA.specialCustomers && (Math.random() < DATA.zombieChance || (set === SETS - 1 && !zombieSeen))) {
        z = 1 + ((Math.random() * (COLS - 2)) | 0); zombieSeen = true; // 2〜4人目
      }
      guests.forEach((c, i) => out.push(
        i === COLS - 1 && DATA.rush ? { customer: c.id, bread: 'rush' } :      // 5人目は「いっぱい ください!」
        i === z ? { customer: DATA.specialCustomers[0].id, bread: 'ramen' } :
        { customer: c.id, bread: pool[i % pool.length].id }));
    }
    return out;
  }
  // テスト用: ?orders=melon,ramen,... で注文を固定できる
  const FIXED = new URLSearchParams(location.search).get('orders');
  if (FIXED) DATA.orders = FIXED.split(',').map((b, i) => b === 'ramen'
    ? { customer: DATA.specialCustomers[0].id, bread: 'ramen' }
    : { customer: DATA.customers[i % DATA.customers.length].id, bread: b });
  // (rush も ?orders= で指定できる)
  let ORDERS = DATA.orders || makeOrders();
  const RUSH_POOL = DATA.breads.filter(b => !b.special);

  /* ---------------- 絵 ---------------- */
  const GHOST = 'M-36 6 A36 36 0 0 1 36 6 L36 44 Q27 56 18 44 Q9 56 0 44 Q-9 56 -18 44 Q-27 56 -36 44 Z';
  const drawShapes = (g, shapes) => (shapes || []).forEach(s => el(s.type, s.attrs, g));

  function drawCustomer(g, c, mood = 'smile') {
    if (!c.shapes) return drawGhost(g, c, mood);
    clear(g); drawShapes(g, c.shapes);
    if (c.faces) drawShapes(g, c.faces[mood]);
    if (c.face) drawFace(g, c.face, mood);
    drawShapes(g, c.over);
  }
  // 妖怪の顔(データの位置で描く)
  function drawFace(g, f, mood) {
    const cx = f.cx || 0, cy = f.cy === undefined ? 5 : f.cy, dx = f.dx || 12, e = f.eye || 6.5;
    const my = f.mouthY === undefined ? cy + 11 : f.mouthY;
    if (f.cheekDx) {
      el('ellipse', { cx: cx - f.cheekDx, cy: f.cheekY, rx: 5.5, ry: 3.2, fill: f.cheek || '#FFB3C7' }, g);
      el('ellipse', { cx: cx + f.cheekDx, cy: f.cheekY, rx: 5.5, ry: 3.2, fill: f.cheek || '#FFB3C7' }, g);
    }
    const eyes = f.one ? [cx] : [cx - dx, cx + dx];
    if (mood === 'happy') {
      eyes.forEach(x => { const w = f.one ? e * 1.4 : e * .8;
        el('path', { d: `M${x - w} ${cy + 2} Q${x} ${cy - w * 1.2} ${x + w} ${cy + 2}`, fill: 'none', stroke: S.ink, 'stroke-width': 3, 'stroke-linecap': 'round' }, g); });
      el('path', { d: `M${cx - 7} ${my - 2} Q${cx} ${my + 12} ${cx + 7} ${my - 2} Z`, fill: '#C2455E', stroke: S.ink, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, g);
    } else {
      eyes.forEach(x => {
        if (f.one) {
          el('circle', { cx: x, cy, r: e * 1.5, fill: '#FFFFFF', stroke: S.ink, 'stroke-width': 2.5 }, g);
          el('circle', { cx: x, cy: cy + 1, r: e * .8, fill: S.ink }, g);
          el('circle', { cx: x + 2, cy: cy - 2, r: e * .25, fill: '#FFFFFF' }, g);
        } else {
          el('ellipse', { cx: x, cy, rx: e * .7, ry: e, fill: S.ink }, g);
          el('circle', { cx: x + e * .25, cy: cy - e * .4, r: e * .25, fill: '#FFFFFF' }, g);
        }
      });
      el('path', { d: `M${cx - 6} ${my} Q${cx} ${my + 6} ${cx + 6} ${my}`, fill: 'none', stroke: S.ink, 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
    }
  }
  function drawGhost(g, c, mood = 'smile') {
    clear(g);
    drawShapes(g, c.behind);
    el('path', { d: GHOST, fill: c.body, stroke: S.ink, 'stroke-width': 3, 'stroke-linejoin': 'round' }, g);
    drawShapes(g, c.front);
    el('ellipse', { cx: -22, cy: 17, rx: 6, ry: 3.5, fill: c.cheek }, g);
    el('ellipse', { cx: 22, cy: 17, rx: 6, ry: 3.5, fill: c.cheek }, g);
    if (mood === 'happy') {
      el('path', { d: 'M-17 7 Q-12 -1 -7 7', fill: 'none', stroke: S.ink, 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
      el('path', { d: 'M7 7 Q12 -1 17 7', fill: 'none', stroke: S.ink, 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
      el('path', { d: 'M-8 14 Q0 29 8 14 Z', fill: '#C2455E', stroke: S.ink, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, g);
    } else {
      el('ellipse', { cx: -12, cy: 5, rx: 4.5, ry: 6.5, fill: S.ink }, g);
      el('ellipse', { cx: 12, cy: 5, rx: 4.5, ry: 6.5, fill: S.ink }, g);
      el('circle', { cx: -10.5, cy: 2.5, r: 1.6, fill: '#fff' }, g);
      el('circle', { cx: 13.5, cy: 2.5, r: 1.6, fill: '#fff' }, g);
      el('path', { d: 'M-6 16 Q0 22 6 16', fill: 'none', stroke: S.ink, 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
    }
  }

  // tags: 見せる部品 / baked: やけたか / partial: {tag, n} または {tag, set} 途中まで見せる部品
  function drawBread(g, bread, tags, baked, partial) {
    clear(g);
    const idx = {};
    for (const s of DATA.commonShapes.concat(bread.shapes)) {
      if (!tags.has(s.tag)) continue;
      if (partial && partial.tag === s.tag) {
        const i = idx[s.tag] = (idx[s.tag] === undefined ? 0 : idx[s.tag] + 1);
        if (partial.set ? !partial.set.has(i) : i >= partial.n) continue;
      }
      const a = Object.assign({}, s.attrs);
      if (!baked && s.rawAttrs) Object.assign(a, s.rawAttrs);
      else if (!baked && s.bake) {
        if (a.fill && a.fill !== 'none') a.fill = S.dough;
        if (a.stroke && a.stroke !== 'none' && a.stroke !== S.ink) a.stroke = S.dough;
      }
      el(s.type, a, g);
    }
  }
  const countTag = (bread, tag) => bread.shapes.filter(x => x.tag === tag).length;

  /* ---------------- 音(コードで合成) ---------------- */
  let ac;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  // パンごとの音の「声色」
  const SND_DEFAULT = { pitch: 1, wave: 'sine', melody: [1047, 1319, 1568, 2093] };
  let SND = SND_DEFAULT;
  const W = () => SND.wave;
  function tone(freq, dur, type = 'sine', vol = .25, when = 0, slideTo) {
    const k = SND.pitch || 1;
    toneRaw(freq * k, dur, type, vol, when, slideTo ? slideTo * k : slideTo);
  }
  function toneRaw(freq, dur, type = 'sine', vol = .25, when = 0, slideTo) {
    const a = audio(); if (!a) return;
    if (type === 'square' || type === 'sawtooth') vol *= .45;
    const t = a.currentTime + when;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (SND.wobble && dur > .09) { // おばけっぽいゆらぎ
      const lfo = a.createOscillator(), lg = a.createGain();
      lfo.frequency.value = 9; lg.gain.value = freq * .06;
      lfo.connect(lg).connect(o.frequency); lfo.start(t); lfo.stop(t + dur + .05);
    }
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, vol, freq, type = 'lowpass') {
    const a = audio(); if (!a) return;
    const b = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = b;
    const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = a.createGain(); const t = a.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.2, dur / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(a.destination); s.start();
  }
  const SFX = {
    pop:    () => tone(420, .16, W(), .3, 0, 1100),
    mochi:  () => tone(160 + Math.random() * 60, .12, W(), .25, 0, 90),
    pechi:  n  => { noise(.08, .3, 1800 * SND.pitch, 'bandpass'); tone(300 - n * 30, .12, W(), .25, 0, 140); },
    squeeze:() => tone(180, 1.1, W(), .18, 0, 520),
    swish:  () => { noise(.2, .12, 1400 * SND.pitch, 'bandpass'); tone(600, .12, W(), .05, 0, 900); },
    goro:   () => tone(85 + Math.random() * 25, .16, W(), .3, 0, 60),
    shu:    () => { noise(.25, .2, 3000, 'highpass'); tone(500, .22, W(), .18, 0, 1500); },
    nyu:    () => tone(520 + Math.random() * 80, .1, W(), .07, 0, 640),
    shaka:  () => { noise(.09, .3, 5000, 'highpass'); tone(1800 + Math.random() * 400, .05, W(), .04); },
    pin:    n  => { tone(1319 + n * 160, .2, W(), .22); tone(2637 + n * 320, .12, 'sine', .06); },
    sasa:   () => noise(.12, .07, 4000 * SND.pitch, 'highpass'),
    tick:   n  => tone(900 + n * 90, .08, W(), .15),
    stamp:  () => { tone(140, .18, 'square', .15, 0, 70); tone(700, .12, W(), .2, .12, 1400); },
    whoosh: () => noise(.45, .22, 1800),
    rumble: () => noise(1.5, .3, 380),
    splash: () => { noise(.35, .3, 900); tone(300, .2, W(), .2, 0, 120); },
    ding:   () => { tone(1568, 1.2, W(), .3); tone(2093, 1.0, 'sine', .14, .02); },
    paku:   () => { tone(320, .08, 'square', .12); tone(220, .1, 'square', .12, .12); },
    kira:   () => SND.melody.forEach((f, i) => toneRaw(f, .25, W(), .2, i * .08)),
    yay:    () => [784, 988, 1175, 1568, 1175, 1568].forEach((f, i) => toneRaw(f, .2, 'triangle', .2, i * .09)),
    fanfare:() => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => toneRaw(f, i === 5 ? .7 : .3, 'triangle', .25, i * .15))
  };

  /* ---------------- 演出 ---------------- */
  const fx = $('fx');
  const CONFETTI = ['#FF8FB8', '#FFE36E', '#8FD3FF', '#FFB547', '#C9B6F2'];
  function burst(x, y, colors, n = 10, d = 60, r = 4) {
    for (let i = 0; i < n; i++) {
      const ang = (Math.PI * 2 * i) / n + Math.random() * .4;
      const g = el('g', { transform: `translate(${x},${y})` }, fx);
      const c = el('circle', { r: r + Math.random() * 3, fill: colors[i % colors.length], class: 'a' }, g);
      c.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${Math.cos(ang) * d}px,${Math.sin(ang) * d}px) scale(.2)`, opacity: 0 }
      ], { duration: 700, easing: 'cubic-bezier(.2,.8,.3,1)' }).finished.then(() => g.remove());
    }
  }
  function puff(x, y) { burst(x, y, ['#FFFFFF', '#FFF3DA'], 5, 22, 3); }
  function ringWave(x, y, color = S.cream) {
    const g = el('g', { transform: `translate(${x},${y})` }, fx);
    const c = el('circle', { r: 20, fill: 'none', stroke: color, 'stroke-width': 4, class: 'a' }, g);
    c.animate([{ transform: 'scale(.5)', opacity: 1 }, { transform: 'scale(2.6)', opacity: 0 }], { duration: 450, easing: 'ease-out' }).finished.then(() => g.remove());
  }
  function hearts(x, y) {
    for (let i = 0; i < 3; i++) {
      const g = el('g', { transform: `translate(${x + (i - 1) * 22},${y})` }, fx);
      const h = el('path', { d: 'M0 4 C-10 -6 -4 -14 0 -8 C4 -14 10 -6 0 4 Z', fill: '#FF6F91', class: 'a' }, g);
      h.animate([{ transform: 'translateY(0) scale(.4)', opacity: 0 }, { transform: 'translateY(-16px) scale(1.2)', opacity: 1, offset: .3 }, { transform: 'translateY(-50px) scale(1)', opacity: 0 }],
        { duration: 1100, delay: i * 120 }).finished.then(() => g.remove());
    }
  }
  function say(t) {
    const m = $('msg'); m.textContent = t || '';
    if (t) m.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250 });
  }

  // ゆびについてくる手・道具
  const fol = $('follower'), folA = $('folAnim'), folG = $('followerGfx');
  function follower(tool, p) {
    if (!tool) { fol.style.display = 'none'; fol.dataset.tool = ''; return; }
    if (fol.dataset.tool !== tool) {
      clear(folG); drawShapes(folG, DATA.tools[tool]); fol.dataset.tool = tool;
      folA.getAnimations().forEach(a => a.cancel());
    }
    fol.style.display = '';
    if (p) setPos(fol, p);
  }

  // おてほんの指
  function hint(mode, a, b) {
    const h = $('hand'), ha = $('handAnim');
    ha.getAnimations().forEach(x => x.cancel());
    if (!mode) { h.style.display = 'none'; return; }
    h.style.display = '';
    const H = P.home;
    const loop = (pts, dur) => {
      const o = pts[0];
      h.setAttribute('transform', `translate(${o.x + 8},${o.y + 8})`);
      ha.animate(pts.map((q, i) => ({ transform: `translate(${q.x - o.x}px,${q.y - o.y}px)`, opacity: (i === 0 || i === pts.length - 1) ? 0 : 1 })),
        { duration: dur, iterations: Infinity, easing: 'ease-in-out' });
    };
    if (mode === 'press') {
      const o = a || H;
      h.setAttribute('transform', `translate(${o.x + 8},${o.y + 8})`);
      ha.animate([{ transform: 'scale(1)' }, { transform: 'scale(.7)' }, { transform: 'scale(1)' }], { duration: 900, iterations: Infinity });
    } else if (mode === 'wiggle') {
      const l = { x: H.x - 30, y: H.y }, r = { x: H.x + 30, y: H.y - 8 };
      loop([l, l, r, l, r, r], 1800);
    } else if (mode === 'drag') {
      loop([P[a], P[a], P[b], P[b]], 1600);
    } else if (mode === 'circle') {
      const c = a || H, rx = b || 42, ry = b || 30;
      const pts = [];
      for (let i = 0; i <= 16; i++) { const t = i / 16 * Math.PI * 2; pts.push({ x: c.x + rx * Math.cos(t), y: c.y + ry * Math.sin(t) }); }
      loop([pts[0], ...pts, pts[pts.length - 1]], 2000);
    } else if (mode === 'swipe') {
      loop([a, a, b, b], 1200);
    } else if (mode === 'up') {
      const lo = { x: H.x, y: H.y + 30 }, hi = { x: H.x, y: H.y - 60 };
      loop([lo, lo, hi, hi], 1000);
    } else if (mode === 'updown') {
      const hi = { x: H.x, y: H.y - 40 }, lo = { x: H.x, y: H.y + 40 };
      loop([hi, hi, lo, hi, lo, lo], 2000);
    } else if (mode === 'shake') {
      const y = H.y - 70, l = { x: H.x - 35, y }, r = { x: H.x + 35, y };
      loop([l, l, r, l, r, l, r, r], 1400);
    } else if (mode === 'path') {
      loop([a[0], ...a, a[a.length - 1]], 700 + a.length * 30);
    }
  }

  /* ---------------- シール台紙 ---------------- */
  const ROWS = SETS;
  const slotPos = (i, row) => ({ x: 52 + i * 64, y: 34 + row * 27 });
  function buildBoard() {
    const b = $('board');
    b.querySelectorAll('.slot').forEach(n => n.remove());
    for (let r = 0; r < ROWS; r++) for (let i = 0; i < COLS; i++) {
      const p = slotPos(i, r);
      el('circle', { cx: p.x, cy: p.y, r: 11, fill: 'none', stroke: S.cream, 'stroke-width': 2, 'stroke-dasharray': '3 4', opacity: .45, class: 'slot' }, b);
    }
  }
  function makeSticker(parent, c) {
    const g = el('g', {}, parent);
    el('circle', { r: 12, fill: c.sticker, stroke: S.cream, 'stroke-width': 2 }, g);
    drawCustomer(el('g', { transform: c.shapes ? 'translate(0,1) scale(.2)' : 'translate(0,-1) scale(.22)' }, g), c, 'happy');
    return g;
  }

  /* ---------------- ゲーム進行 ---------------- */
  let state = 'title', step = 0, si = 0, cust, bread;
  let tags, baked, partial, progress = 0, work = {};
  let pointer = null;
  const layer = $('breadLayer'), bAnim = $('breadAnim'), bGfx = $('breadGfx'), dots = $('dots');
  const under = $('underGfx'), over = $('overGfx');
  const tLayer = $('toolLayer'), tAnim = $('toolAnim');
  const redraw = () => drawBread(bGfx, bread, tags, baked, partial);
  const cur = () => bread.steps[si];
  const gfxTf = (sx = 1, sy = sx, rot = 0) => bGfx.setAttribute('transform', `rotate(${rot}) scale(${SC * sx},${SC * sy})`);

  function drawDots(frac) {
    clear(dots);
    if (frac == null) return;
    const filled = Math.floor(frac * 3 + 1e-6);
    for (let i = 0; i < 3; i++) {
      el('circle', { cx: P.home.x + (i - 1) * 30, cy: 614, r: 9, fill: i < filled ? S.glow : 'none', stroke: S.cream, 'stroke-width': 2.5 }, dots);
    }
  }
  function rings(to) {
    show('breadRing', to === 'bread');
    show('ovenRing', to === 'oven');
    show('custRing', to === 'customer');
    show('toolRing', to === 'tool');
  }
  function showTool(id) {
    clear($('toolGfx')); drawShapes($('toolGfx'), DATA.tools[id]);
    $('toolGfx').setAttribute('transform', `scale(${(DATA.toolScale || {})[id] || 1.5})`);
    setPos(tLayer, P.tool);
    tAnim.getAnimations().forEach(a => a.cancel());
    tLayer.style.display = '';
    anim(tAnim, [{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1.1)', opacity: 1 }, { transform: 'scale(1)', opacity: 1 }], { duration: 350 });
  }
  const hideTool = () => { tLayer.style.display = 'none'; };

  // まぜるボウル(パンの座標で描く)
  function drawMixBowl() {
    el('ellipse', { cx: 0, cy: -4, rx: 58, ry: 17, fill: '#5E9FCC', stroke: S.ink, 'stroke-width': 3 }, under);
    el('path', { d: 'M-58 -4 Q-56 46 0 48 Q56 46 58 -4 Q0 26 -58 -4 Z', fill: '#8FD3FF', stroke: S.ink, 'stroke-width': 3, 'stroke-linejoin': 'round' }, over);
    el('ellipse', { cx: -30, cy: 20, rx: 8, ry: 4, fill: '#C9ECFF' }, over);
  }
  // ゆでるお鍋
  function drawPot() {
    el('ellipse', { cx: 0, cy: -8, rx: 58, ry: 16, fill: '#4A4E66', stroke: S.ink, 'stroke-width': 3 }, under);
    el('ellipse', { cx: 0, cy: -6, rx: 52, ry: 12, fill: '#9FD8F5' }, under);
    el('rect', { x: -72, y: -6, width: 16, height: 9, rx: 4.5, fill: S.ink }, over);
    el('rect', { x: 56, y: -6, width: 16, height: 9, rx: 4.5, fill: S.ink }, over);
    el('path', { d: 'M-58 -8 L-54 40 Q0 50 54 40 L58 -8 Q0 14 -58 -8 Z', fill: '#8E93B0', stroke: S.ink, 'stroke-width': 3, 'stroke-linejoin': 'round' }, over);
    el('path', { d: 'M-44 10 L-42 34', stroke: '#B8BCD6', 'stroke-width': 4, 'stroke-linecap': 'round' }, over);
  }
  function steam() {
    for (let i = 0; i < 3; i++) {
      const g = el('g', { transform: `translate(${P.home.x + (i - 1) * 26},${P.home.y - 20})` }, fx);
      const c = el('circle', { r: 7, fill: '#FFFFFF', opacity: .7, class: 'a' }, g);
      c.animate([{ transform: 'translateY(0) scale(.6)', opacity: .7 }, { transform: 'translateY(-40px) scale(1.4)', opacity: 0 }],
        { duration: 800, delay: i * 90 }).finished.then(() => g.remove());
    }
  }
  function drops(color) {
    const t = fol.transform.baseVal[0].matrix;
    const g = el('g', { transform: `translate(${t.e},${t.f})` }, fx);
    const c = el('circle', { r: 3.5, fill: color, class: 'a' }, g);
    c.animate([{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${P.home.x - t.e}px,${P.home.y - t.f}px)`, opacity: .4 }],
      { duration: 350, easing: 'ease-in' }).finished.then(() => g.remove());
  }

  // なぞりの点線
  function setupGuides(s) {
    work.guides = s.guides.map(d => {
      const guide = el('path', { d, fill: 'none', stroke: S.cream, 'stroke-width': 3, 'stroke-dasharray': '2 5', 'stroke-linecap': 'round', opacity: .9 }, over);
      const L = guide.getTotalLength();
      const pts = [];
      for (let l = 0; l <= L; l += 3) { const q = guide.getPointAtLength(l); pts.push({ x: q.x, y: q.y }); }
      const line = el('polyline', { points: '', fill: 'none', stroke: s.color, 'stroke-width': s.width || 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, over);
      return { guide, pts, line, i: 0 };
    });
    work.gi = 0;
    markGuide();
  }
  function markGuide() {
    work.guides.forEach((g, k) => g.guide.setAttribute('stroke', k === work.gi ? '#FFFFFF' : S.cream));
    const g = work.guides[work.gi];
    if (g) hint('path', g.pts.filter((_, k) => k % 3 === 0).map(toS));
  }
  // ぽちぽちの目印
  function setupSpots(s) {
    work.marks = s.spots.map(([x, y]) => {
      const m = el('circle', { cx: x, cy: y, r: 9, fill: 'none', stroke: '#FFFFFF', 'stroke-width': 2.5, class: 'pulse' }, over);
      return m;
    });
  }
  const firstSpot = s => { const i = s.spots.findIndex((_, k) => !partial.set.has(k)); return toS({ x: s.spots[i][0], y: s.spots[i][1] }); };

  async function nextCustomer() {
    const order = ORDERS[step];
    cust = byId(ALL_CUSTOMERS, order.customer);
    bread = order.bread === 'rush' ? RUSH_BREAD : byId(DATA.breads, order.bread);
    si = 0; tags = new Set(bread.startTags); baked = false; partial = null;
    SND = SND_DEFAULT;
    state = 'busy';
    drawCustomer($('custGfx'), cust, 'smile');
    $('custGfx').setAttribute('transform', `scale(${1.3 * (cust.size || 1)})`);
    if (bread === RUSH_BREAD) {
      const bb = $('bubbleBread'); clear(bb);
      shuffle(DATA.breads.filter(b => !b.special)).slice(0, 3).forEach((b, i) => {
        const g = el('g', { transform: `translate(${(i - 1) * 30},${i === 1 ? -8 : 8}) scale(.42)` }, bb);
        drawBread(g, b, new Set(b.finalTags), true);
      });
    } else drawBread($('bubbleBread'), bread, new Set(bread.finalTags), true);
    setPos(layer, P.home);
    anim(bAnim, [{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(0)', opacity: 0 }], { duration: 1 });
    gfxTf(); clear(under); clear(over);
    if (bread.steps[0].type === 'stir' && bread.steps[0].bowl) drawMixBowl();
    redraw(); drawDots(null); say(''); rings(null); hint(null); hideTool(); follower(null); ovenReset();
    SFX.whoosh();
    await anim($('custAnim'), [
      { transform: 'translate(-40px,20px) scale(.5)', opacity: 0 },
      { transform: 'translate(0,0) scale(1)', opacity: 1 }
    ], { duration: 800, easing: 'cubic-bezier(.3,1.5,.5,1)' });
    say(bread === RUSH_BREAD ? DATA.rush.hello : (cust.hello || T.hello)); SFX.pop();
    await anim($('bubble'), [{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
      { duration: 400, easing: 'cubic-bezier(.3,1.6,.5,1)' });
    await anim(bAnim, [{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1.1)', opacity: 1 }, { transform: 'scale(1)', opacity: 1 }], { duration: 400 });
    await wait(400);
    SND = Object.assign({}, SND_DEFAULT, bread.sound || {});
    beginStep();
  }

  function beginStep() {
    const s = cur();
    progress = 0; work = {};
    say(s.type === 'drag' || s.type === 'place' ? s.say : s.say);
    if (s.tag) { partial = s.type === 'spots' ? { tag: s.tag, set: new Set() } : { tag: s.tag, n: 0 }; tags.add(s.tag); redraw(); }
    rings(null); drawDots(null);
    switch (s.type) {
      case 'drag':
        raise(layer);
        if (s.tool) showTool(s.tool);
        rings(s.to); hint('drag', 'home', s.to); break;
      case 'place':
        showTool(s.tool); raise(tLayer);
        rings('tool'); hint('drag', 'tool', 'home'); break;
      case 'tap':   rings('bread'); drawDots(0); hint('press'); break;
      case 'hold':  rings('bread'); hint('press'); break;
      case 'rub':   rings('bread'); drawDots(0); hint('wiggle'); break;
      case 'brush': rings('bread'); drawDots(0); hint('wiggle'); follower('brush', { x: P.home.x + 58, y: P.home.y - 20 }); break;
      case 'stir':
        if (s.bowl && !under.firstChild) drawMixBowl();
        if (s.pot && !under.firstChild) drawPot();
        rings(s.bowl || s.pot ? null : 'bread'); drawDots(0); hint('circle');
        work.rot = 0; work.acc = 0; break;
      case 'roll':
        drawDots(0); hint('updown');
        follower('pin', { x: P.home.x, y: P.home.y - 45 }); work.pinY = P.home.y - 45; break;
      case 'flick': rings('bread'); drawDots(0); hint('up'); break;
      case 'path':  drawDots(0); setupGuides(s); break;
      case 'shake':
        drawDots(0); hint('shake');
        follower('shaker', { x: P.home.x, y: P.home.y - 60 }); break;
      case 'spots': drawDots(0); setupSpots(s); hint('press', firstSpot(s)); break;
      case 'bake': setupBake(s); break;
      case 'rush': startRush(); return;
    }
    state = 'play';
  }

  async function completeStep() {
    state = 'busy'; pointer = null;
    const s = cur();
    hint(null); rings(null); follower(null);
    if (s.done) {
      (s.done.hide || []).forEach(t => tags.delete(t));
      (s.done.show || []).forEach(t => tags.add(t));
    }
    partial = null;
    gfxTf();
    const hadBowl = s.type === 'stir' && (s.bowl || s.pot);
    clear(over);
    if (!hadBowl) clear(under);
    redraw();
    if (s.type !== 'drag') {
      await wait(250);
      SFX.kira();
      burst(P.home.x, P.home.y, [S.cream, S.glow, '#FFFFFF'], 12, 70);
      await anim(bAnim, [{ transform: 'scale(.7)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 420 });
      if (hadBowl) { // ボウルからとりだす
        clear(under);
        await anim(bAnim, [{ transform: 'translateY(0)' }, { transform: 'translateY(-26px)' }, { transform: 'translateY(0)' }], { duration: 380, easing: 'ease-out' });
      }
      drawDots(null);
      await wait(250);
    }
    si++;
    beginStep();
  }

  /* ---------------- アクション ---------------- */
  function squish() {
    anim(bAnim, [{ transform: 'scale(1,1)' }, { transform: 'scale(1.25,.75)' }, { transform: 'scale(.92,1.1)' }, { transform: 'scale(1,1)' }], { duration: 360, easing: 'ease-out' });
  }
  function slap(p) {
    const g = el('g', { transform: `translate(${p.x},${p.y - 6})` }, fx);
    const inner = el('g', { class: 'a' }, g);
    drawShapes(el('g', { transform: 'scale(1.4)' }, inner), DATA.tools.mitten);
    inner.animate([
      { transform: 'translateY(-40px) scale(1.2)', opacity: 0 },
      { transform: 'translateY(0) scale(1)', opacity: 1, offset: .35 },
      { transform: 'translateY(0) scale(.92,.85)', opacity: 1, offset: .55 },
      { transform: 'translateY(-20px) scale(1)', opacity: 0 }
    ], { duration: 420, easing: 'ease-out' }).finished.then(() => g.remove());
    setTimeout(() => ringWave(p.x, p.y + 6), 140);
  }

  function onDown(e) {
    if (state !== 'play') return;
    e.preventDefault();
    audio();
    const s = cur(), p = svgPt(e);
    const onBread = dist(p, P.home) < 80;
    switch (s.type) {
      case 'tap': {
        if (!onBread) return;
        hint(null);
        progress++;
        slap(p); SFX.pechi(progress);
        setTimeout(squish, 140);
        if (s.squash) gfxTf(1 + s.squash * progress, 1 - s.squash * progress);
        if (s.tag) { partial.n = progress * (s.perTap || 1); redraw(); }
        drawDots(progress / s.count);
        if (progress >= s.count) { state = 'busy'; setTimeout(completeStep, 300); }
        break;
      }
      case 'hold': {
        if (!onBread) return;
        hint(null);
        if (s.follower) {
          follower(s.follower, { x: P.home.x + 18, y: P.home.y - 38 });
          folA.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(-35deg)' }], { duration: 300, fill: 'forwards' });
          work.dropT = 0;
        } else {
          work.dent = el('ellipse', { cx: 0, cy: 0, rx: 3, ry: 3, fill: S.ink, opacity: .28 }, over);
          follower('mitten', { x: P.home.x + 4, y: P.home.y - 4 });
          folA.animate([{ transform: 'scale(1)' }, { transform: 'scale(.88)' }], { duration: s.ms, fill: 'forwards' });
        }
        pointer = { mode: 'hold', t0: performance.now() };
        SFX.squeeze();
        show('holdRing', true);
        holdTick();
        break;
      }
      case 'rub': hint(null); pointer = { mode: 'rub', last: p, acc: 0 }; follower('mitten', p); break;
      case 'brush': hint(null); pointer = { mode: 'rub', last: p, acc: 0 }; follower('brush', p); break;
      case 'stir':
        hint(null);
        pointer = { mode: 'stir', lastA: Math.atan2(p.y - P.home.y, p.x - P.home.x), acc: 0 };
        follower(s.bowl || s.pot ? 'spoon' : 'mitten', p); break;
      case 'roll': hint(null); pointer = { mode: 'roll', lastY: p.y, acc: 0 }; break;
      case 'flick': hint(null); pointer = { mode: 'flick', y0: p.y, fired: false }; break;
      case 'path': hint(null); work.needLift = false; pointer = { mode: 'path' }; follower('bag', p); pathMove(p); break;
      case 'shake': hint(null); pointer = { mode: 'shake', lastX: p.x, dir: 0, run: 0 }; shakerTo(p); break;
      case 'spots': spotTap(p); break;
      case 'bake': bakeDown(s, p); break;
      case 'rush': if (work.running) { hint(null); pointer = { mode: 'rushRub', last: p, acc: 0 }; follower('mitten', p); } break;
      case 'drag':
        if (!onBread) return;
        hint(null);
        pointer = { mode: 'drag', off: { x: P.home.x - p.x, y: P.home.y - p.y } };
        SFX.pop();
        anim(bAnim, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }], { duration: 150 });
        break;
      case 'place': {
        const tp = { x: +tLayer.transform.baseVal[0].matrix.e, y: +tLayer.transform.baseVal[0].matrix.f };
        if (dist(p, tp) > 70) return;
        hint(null);
        pointer = { mode: 'tool', off: { x: tp.x - p.x, y: tp.y - p.y } };
        SFX.pop();
        anim(tAnim, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }], { duration: 150 });
        break;
      }
    }
  }

  const HOLD_C = 2 * Math.PI * 56;
  function holdTick() {
    if (!pointer || pointer.mode !== 'hold') return;
    const s = cur();
    const f = Math.min(1, (performance.now() - pointer.t0) / s.ms);
    $('holdRing').setAttribute('stroke-dasharray', `${HOLD_C * f} ${HOLD_C}`);
    if (work.dent) { work.dent.setAttribute('rx', 3 + 11 * f); work.dent.setAttribute('ry', 3 + 10 * f); }
    if (s.follower) {
      const now = performance.now();
      if (now - work.dropT > 90) { work.dropT = now; drops(s.follower === 'bag' ? '#5A3320' : '#E8B04A'); if (Math.random() < .5) SFX.nyu(); }
    } else gfxTf(1 + .06 * f, 1 - .08 * f);
    if (f >= 1) {
      pointer = null; show('holdRing', false);
      SFX.pop();
      ringWave(P.home.x, P.home.y, '#FFFFFF');
      burst(P.home.x, P.home.y, ['#FFFFFF', S.cream], 8, 40);
      completeStep();
      return;
    }
    requestAnimationFrame(holdTick);
  }

  function shakerTo(p) { follower('shaker', { x: p.x, y: Math.min(p.y, P.home.y - 40) }); }
  function shakeHit() {
    const s = cur();
    const total = countTag(bread, s.tag);
    SFX.shaka();
    const side = folA.dataset.side === '1' ? -1 : 1; folA.dataset.side = side === 1 ? '1' : '0';
    folA.animate([{ transform: 'rotate(0deg)' }, { transform: `rotate(${side * 22}deg)` }, { transform: 'rotate(0deg)' }], { duration: 180 });
    const t = fol.transform.baseVal[0].matrix;
    for (let i = 0; i < 4; i++) {
      const x0 = t.e + (Math.random() - .5) * 16, y0 = t.f;
      const g = el('g', { transform: `translate(${x0},${y0})` }, fx);
      const r = el('rect', { x: -3.5, y: -1.5, width: 7, height: 3, rx: 1.5, fill: CONFETTI[(Math.random() * 5) | 0], class: 'a' }, g);
      const ty = P.home.y - y0 + (Math.random() - .5) * 30, tx = (P.home.x - x0) * .6 + (Math.random() - .5) * 40;
      r.animate([{ transform: 'translate(0,0) rotate(0deg)', opacity: 1 }, { transform: `translate(${tx}px,${ty}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }],
        { duration: 500, easing: 'ease-in' }).finished.then(() => g.remove());
    }
    setTimeout(() => {
      if (!partial || partial.tag !== s.tag) return;
      partial.n = Math.min(total, partial.n + (s.perShake || 1)); redraw();
      drawDots(partial.n / total);
      if (partial.n >= total && state === 'play') { pointer = null; completeStep(); }
    }, 350);
  }

  function pathMove(p) {
    const b = toB(p);
    const g = work.guides[work.gi]; if (!g) return;
    if (work.needLift) return;              // 1本かいたら、いったん指をはなす
    if (g.i === 0) {                        // かきはじめは点線のスタート近くから
      if (dist(b, g.pts[0]) > 18) return;
      g.i = 1;
    }
    for (let k = g.i; k < Math.min(g.pts.length, g.i + 3); k++) {
      if (dist(b, g.pts[k]) < 18) {
        g.i = k + 1;
        g.line.setAttribute('points', g.pts.slice(0, g.i).map(q => `${q.x},${q.y}`).join(' '));
        if (Math.random() < .35) SFX.nyu();
        break;
      }
    }
    const n = work.guides.length;
    drawDots((work.gi + g.i / g.pts.length) / n);
    if (g.i >= g.pts.length - 1) {
      g.line.setAttribute('points', g.pts.map(q => `${q.x},${q.y}`).join(' '));
      g.guide.style.display = 'none';
      SFX.pin(work.gi);
      const end = toS(g.pts[g.pts.length - 1]);
      burst(end.x, end.y, ['#FFFFFF', S.cream], 6, 22, 3);
      work.gi++;
      work.needLift = true;
      if (work.gi >= n) { pointer = null; follower(null); completeStep(); }
      else { work.guides.forEach((q, k) => q.guide.setAttribute('stroke', k === work.gi ? '#FFFFFF' : S.cream)); }
    }
  }

  function spotTap(p) {
    const s = cur(), b = toB(p);
    let best = -1, bd = 26;
    s.spots.forEach(([x, y], k) => { const d = dist(b, { x, y }); if (!partial.set.has(k) && d < bd) { bd = d; best = k; } });
    if (best < 0) return;
    hint(null);
    partial.set.add(best); redraw();
    work.marks[best].remove();
    const q = toS({ x: s.spots[best][0], y: s.spots[best][1] });
    SFX.pin(partial.set.size);
    ringWave(q.x, q.y, '#FFFFFF');
    burst(q.x, q.y, ['#FFFFFF', '#E6EEF7', S.cream], 6, 22, 3);
    drawDots(partial.set.size / s.spots.length);
    if (partial.set.size >= s.spots.length) completeStep();
    else hint('press', firstSpot(s));
  }

  function onMove(e) {
    if (!pointer || state !== 'play') return;
    const s = cur(), p = svgPt(e);
    switch (pointer.mode) {
      case 'rub': {
        const d = dist(p, pointer.last); pointer.last = p;
        follower(s.type === 'brush' ? 'brush' : 'mitten', p);
        if (d > 140) return;
        progress += d; pointer.acc += d;
        if (s.type === 'rub') {
          if (pointer.acc > 70) { pointer.acc = 0; SFX.mochi(); squish(); puff(p.x, p.y); }
          drawDots(progress / s.amount);
          if (progress >= s.amount) completeStep();
        } else {
          if (pointer.acc > 45) { pointer.acc = 0; SFX.sasa(); }
          const total = countTag(bread, s.tag);
          const n = Math.min(total, Math.floor(progress / s.per));
          if (n > partial.n) {
            partial.n = n; redraw(); SFX.tick(n);
            burst(p.x, p.y, ['#FFFFFF', '#FFF6D6'], 4, 18, 2);
            drawDots(n / total);
            if (n >= total) completeStep();
          }
        }
        break;
      }
      case 'stir': {
        follower(s.bowl || s.pot ? 'spoon' : 'mitten', p);
        const a = Math.atan2(p.y - P.home.y, p.x - P.home.x);
        let d = a - pointer.lastA; pointer.lastA = a;
        if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
        if (Math.abs(d) > 1.2 || dist(p, P.home) < 8) return;
        work.acc += Math.abs(d); pointer.acc += Math.abs(d);
        work.rot += d * 180 / Math.PI * .8;
        const f = Math.min(1, work.acc / (s.turns * 2 * Math.PI));
        if (!s.noSpin) gfxTf(1 - .08 * f, 1 - .08 * f, work.rot);
        if (s.tag) {
          const n = Math.floor(f * countTag(bread, s.tag) + 1e-6);
          if (n !== partial.n) { partial.n = n; redraw(); SFX.tick(n); }
        }
        if (pointer.acc > 1.1) {
          pointer.acc = 0;
          if (s.pot) { SFX.swish(); steam(); } else if (s.bowl) SFX.swish(); else { SFX.mochi(); puff(p.x, p.y); }
        }
        drawDots(f);
        if (f >= 1) completeStep();
        break;
      }
      case 'roll': {
        const y = Math.max(P.home.y - 50, Math.min(P.home.y + 50, p.y));
        const d = Math.abs(y - pointer.lastY); pointer.lastY = y;
        follower('pin', { x: P.home.x, y });
        folA.style.transform = `rotate(${Math.sin(y / 9) * 4}deg)`;
        if (d > 50) return;
        progress += d; pointer.acc += d;
        const f = Math.min(1, progress / s.amount);
        gfxTf(1 + .22 * f, 1 - .12 * f);
        if (pointer.acc > 38) { pointer.acc = 0; SFX.goro(); }
        drawDots(f);
        if (f >= 1) { folA.style.transform = ''; completeStep(); }
        break;
      }
      case 'flick': {
        if (!pointer.fired && pointer.y0 - p.y > 40) { pointer.fired = true; flickOne(); }
        break;
      }
      case 'path': follower('bag', p); pathMove(p); break;
      case 'shake': {
        shakerTo(p);
        const dx = p.x - pointer.lastX; pointer.lastX = p.x;
        if (!dx) break;
        const dir = Math.sign(dx);
        if (dir !== pointer.dir) {
          if (pointer.run > 14) shakeHit();
          pointer.dir = dir; pointer.run = 0;
        }
        pointer.run += Math.abs(dx);
        break;
      }
      case 'rushRub': {
        follower('mitten', p);
        const d = dist(p, pointer.last); pointer.last = p;
        if (d > 140) break;
        pointer.acc += d;
        while (pointer.acc >= DATA.rush.perRub && work.running) { pointer.acc -= DATA.rush.perRub; rushOne(p); }
        break;
      }

    await bigText(DATA.rush.end, 50);
    const ui = $('rushUI'); if (ui) ui.remove();
    const n = work.count, isBest = n > rushBest;
    if (isBest) { rushBest = n; try { localStorage.setItem(BEST_KEY, String(n)); } catch (e) {} }
    // カゴごとわたす
    const t = P.customer;
    setPos(layer, t);
    await anim(bAnim, [{ transform: `translate(${P.home.x - t.x}px,${P.home.y - t.y}px) scale(1)`, opacity: 1 },
      { transform: 'translate(0,-10px) scale(.3)', opacity: 0 }], { duration: 650, easing: 'ease-in' });
    setPos(layer, P.home);
    // けっか
    const g = el('g', {}, fx);
    el('rect', { x: 60, y: 396, width: 240, height: isBest ? 160 : 128, rx: 24, fill: S.ink, stroke: S.cream, 'stroke-width': 3, opacity: .95 }, g);
    const t1 = el('text', { x: 180, y: 470, 'text-anchor': 'middle', 'font-size': 48, fill: S.glow }, g);
    t1.textContent = DATA.rush.count.replace('{n}', n);
    const NL = DATA.rush.levels.length;
    for (let i = 0; i < NL; i++)
      el('path', { d: 'M0 -9 L2.6 -3 L9 -2.8 L4 1.4 L5.6 8 L0 4.4 L-5.6 8 L-4 1.4 L-9 -2.8 L-2.6 -3 Z', transform: `translate(${180 + (i - (NL - 1) / 2) * 22},418) scale(.8)`,
        fill: i <= work.lv ? '#FFD84D' : 'none', stroke: i <= work.lv ? S.ink : S.cream, 'stroke-width': 1.5 }, g);
    const t2 = el('text', { x: 180, y: 506, 'text-anchor': 'middle', 'font-size': 18, fill: S.cream }, g);
    t2.textContent = DATA.rush.best.replace('{n}', rushBest);
    if (isBest) {
      const t3 = el('text', { x: 180, y: 540, 'text-anchor': 'middle', 'font-size': 22, fill: '#FF8FB8' }, g);
      t3.textContent = DATA.rush.newBest;
      SFX.fanfare();
      for (let i = 0; i < 3; i++) setTimeout(() => burst(90 + Math.random() * 180, 420 + Math.random() * 80, CONFETTI, 12, 60), i * 250);
    } else SFX.yay();
    g.animate([{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 300 });
    await wait(2000);
    g.remove();
    await eat();
  }

  /* ---- オーブンのアクション ---- */
  function ovenReset() {
    ['ovenDoor', 'ovenBtn', 'dial', 'lever', 'ovenGlass', 'ovenBread'].forEach(id => show(id, false));
    clear($('ovenFire'));
    $('ovenDoorA').getAnimations().forEach(a => a.cancel());
    $('dialRot').setAttribute('transform', 'rotate(0)');
    $('leverArm').setAttribute('transform', 'rotate(-15)');
    $('ovenGlow').getAnimations().forEach(a => a.cancel());
    $('ovenGlow').setAttribute('opacity', .15);
  }
  function setupBake(s) {
    work.acc = 0; work.rot = 0; progress = 0;
    if (s.how === 'door') { show('ovenDoor', true); hint('press', OV.door); }
    if (s.how === 'dial') { show('dial', true); show('ovenGlass', true); drawDots(0); hint('circle', OV.knob, 26); }
    if (s.how === 'fire') { show('ovenGlass', true); drawDots(0); hint('press', OV.body); }
    if (s.how === 'button') { show('ovenBtn', true); show('ovenGlass', true); hint('press', OV.btn); }
    if (s.how === 'lever') { show('lever', true); show('ovenGlass', true); hint('swipe', OV.lever, OV.leverDown); }
    rings('oven');
  }
  const FLAME = 'M0 0 Q-9 -6 -4 -16 Q-2 -10 0 -9 Q0 -20 6 -24 Q4 -14 9 -8 Q9 0 0 0 Z';
  function bakeDown(s, p) {
    if (s.how === 'door' && dist(p, OV.door) < 60) {
      state = 'busy'; hint(null);
      SFX.stamp();
      $('ovenDoorA').animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(-1)' }], { duration: 260, easing: 'ease-in', fill: 'forwards' })
        .finished.then(() => { show('ovenDoor', false); show('ovenGlass', true); SFX.pechi(0); ringWave(OV.body.x, OV.body.y); bakeDone(); });
    } else if (s.how === 'fire' && dist(p, OV.body) < 80) {
      hint(null);
      progress++;
      const x = 290 + (progress - 2) * 18;
      const g = el('g', { transform: `translate(${x},352)` }, $('ovenFire'));
      const inner = el('g', { class: 'a' }, g);
      el('path', { d: FLAME, fill: '#FF7A3D', stroke: S.ink, 'stroke-width': 1.5 }, inner);
      el('path', { d: 'M0 0 Q-4 -4 -1 -9 Q2 -5 4 -4 Q4 0 0 0 Z', fill: '#FFE36E' }, inner);
      inner.animate([{ transform: 'scale(0)' }, { transform: 'scale(1.4)' }, { transform: 'scale(1)' }], { duration: 300, fill: 'forwards' });
      noise(.25, .25, 700); tone(180, .2, 'triangle', .15, 0, 360);
      $('ovenGlow').setAttribute('opacity', .15 + .25 * progress);
      burst(x, 340, ['#FF7A3D', '#FFE36E'], 6, 24, 3);
      drawDots(progress / s.count);
      if (progress >= s.count) { state = 'busy'; setTimeout(bakeDone, 350); }
    } else if (s.how === 'dial' && dist(p, OV.knob) < 85) {
      hint(null);
      pointer = { mode: 'dial', lastA: Math.atan2(p.y - OV.knob.y, p.x - OV.knob.x), acc: 0 };
    } else if (s.how === 'button' && dist(p, OV.btn) < 45) {
      hint(null);
      pointer = { mode: 'btn', t0: performance.now() };
      $('ovenBtnA').animate([{ transform: 'scale(1)' }, { transform: 'scale(.85)' }], { duration: 120, fill: 'forwards' });
      SFX.squeeze();
      btnTick();
    } else if (s.how === 'lever' && dist(p, OV.lever) < 60) {
      hint(null);
      pointer = { mode: 'lever', y0: p.y };
    }
  }
  function btnTick() {
    if (!pointer || pointer.mode !== 'btn') return;
    const s = cur();
    const f = Math.min(1, (performance.now() - pointer.t0) / s.ms);
    $('ovenGlow').setAttribute('opacity', .15 + .8 * f);
    drawDots(f);
    if (f >= 1) { pointer = null; SFX.pop(); bakeDone(); return; }
    requestAnimationFrame(btnTick);
  }
  async function bakeDone() {
    state = 'busy'; hint(null); rings(null); drawDots(null);
    await runBake();
    si++;
    beginStep();
  }
  async function runBake() {
    const t = P.oven;
    say(T.baking);
    SFX.rumble();
    $('ovenGlow').animate([{ opacity: .5 }, { opacity: .95 }, { opacity: .6 }, { opacity: .95 }], { duration: 1500, fill: 'forwards' });
    $('ovenBread').animate([{ transform: 'translate(290px,326px) scale(.55)' }, { transform: 'translate(290px,326px) scale(.66)' }],
      { duration: 1500, fill: 'forwards', easing: 'ease-out' });
    await anim($('ovenBody'), [
      { transform: 'translate(0,0)' }, { transform: 'translate(-2px,0)' }, { transform: 'translate(2px,0)' },
      { transform: 'translate(-2px,0)' }, { transform: 'translate(2px,0)' }, { transform: 'translate(0,0)' }
    ], { duration: 1500 });
    SFX.ding();
    burst(t.x, t.y - 25, ['#FFFFFF', S.cream], 8, 45);
    baked = true; redraw();
    $('ovenBread').getAnimations().forEach(a => a.cancel());
    ovenReset();
    setPos(layer, P.home);
    await anim(bAnim, [
      { transform: `translate(${t.x - P.home.x}px,${t.y - P.home.y}px) scale(.4)`, opacity: 0 },
      { transform: 'translate(0,0) scale(1.2)', opacity: 1, offset: .8 },
      { transform: 'translate(0,0) scale(1)', opacity: 1 }
    ], { duration: 700, easing: 'ease-out' });
    burst(P.home.x, P.home.y, [S.glow, S.cream], 10, 70);
    await wait(300);
  }

  async function eat() {
    SND = SND_DEFAULT;
    SFX.paku();
    drawCustomer($('custGfx'), cust, 'happy');
    anim($('bubble'), [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(0)', opacity: 0 }], { duration: 250 });
    anim($('custAnim'), [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.18,.86)', opacity: 1 }, { transform: 'scale(1)', opacity: 1 }], { duration: 400 });
    hearts(95, 200);
    say(T.thanks);
    await wait(700);
    await giveSticker();
    await wait(300);
    SFX.whoosh();
    await anim($('custAnim'), [
      { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
      { transform: 'translate(-10px,-30px) rotate(360deg) scale(.4)', opacity: 0 }
    ], { duration: 800, easing: 'ease-in' });
    step++;
    if (step >= ORDERS.length) return finish();
    if (step % COLS === 0) { await rowCelebrate(step / COLS - 1); return setBreak(step / COLS); }
    nextCustomer();
  }

  async function giveSticker() {
    const idx = step % COLS, row = Math.floor(step / COLS);
    const p = slotPos(idx, row);
    const holder = el('g', { transform: 'translate(95,250)' }, fx);
    const inner = el('g', { class: 'a' }, holder);
    makeSticker(inner, cust);
    SFX.kira();
    await inner.animate([
      { transform: 'translate(0,0) scale(1.6)' },
      { transform: `translate(${p.x - 95}px,${p.y - 250}px) scale(1)` }
    ], { duration: 800, easing: 'cubic-bezier(.4,0,.3,1)', fill: 'forwards' }).finished;
    holder.remove();
    const placed = el('g', { transform: `translate(${p.x},${p.y})`, class: 'sticker', 'data-row': row }, $('board'));
    const pi = el('g', { class: 'a' }, placed);
    makeSticker(pi, cust);
    pi.animate([{ transform: 'scale(1.5)' }, { transform: 'scale(1)' }], { duration: 300 });
    burst(p.x, p.y, [S.glow, S.cream, '#FFFFFF'], 8, 26);
  }

  async function rowCelebrate(row) {
    say(T.row);
    SFX.yay();
    const ss = [...$('board').querySelectorAll(`.sticker[data-row="${row}"] > g`)];
    ss.forEach((g, i) => g.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.6)' }, { transform: 'scale(1)' }], { duration: 450, delay: i * 90 }));
    for (let i = 0; i < COLS; i++) { const p = slotPos(i, row); setTimeout(() => burst(p.x, p.y, CONFETTI, 8, 30), i * 90); }
    await wait(1400);
  }

  // 1セット(5人)おわりのくぎり
  function setBreak(n) {
    say('');
    $('setText').textContent = T.setDone.replace('{n}', n);
    const g = $('setGhosts'); clear(g);
    ORDERS.slice((n - 1) * COLS, n * COLS).map(o => byId(ALL_CUSTOMERS, o.customer)).forEach((c, i) => {
      const w = el('g', { transform: `translate(${44 + i * 68},310)` }, g);
      const inner = el('g', { class: 'a' }, w);
      drawCustomer(el('g', { transform: `scale(${0.62 * (c.size || 1)})` }, inner), c, 'happy');
      inner.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-12px)' }, { transform: 'translateY(0)' }],
        { duration: 600, iterations: Infinity, delay: i * 90, easing: 'ease-in-out' });
    });
    show('setScreen', true);
    $('setScreen').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
    state = 'set';
  }
  function showEnd(text) {
    $('clearText').textContent = text;
    show('endScreen', true);
    state = 'end';
  }

  async function finish() {
    state = 'busy';
    say(T.finale);
    rings(null); hint(null);
    SFX.fanfare();
    const party = el('g', { id: 'party' }, fx);
    ORDERS.slice(-COLS).map(o => byId(ALL_CUSTOMERS, o.customer)).forEach((c, i) => {
      const x = 44 + i * 68;
      const g = el('g', { transform: `translate(${x},330)` }, party);
      const inner = el('g', { class: 'a' }, g);
      drawCustomer(el('g', { transform: `scale(${0.72 * (c.size || 1)})` }, inner), c, 'happy');
      inner.animate([{ transform: 'translateY(40px) scale(0)', opacity: 0 }, { transform: 'translateY(0) scale(1)', opacity: 1 }],
        { duration: 500, delay: i * 150, fill: 'forwards', easing: 'cubic-bezier(.3,1.6,.5,1)' })
        .finished.then(() => inner.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-18px)' }, { transform: 'translateY(0)' }],
          { duration: 500, iterations: Infinity, delay: i * 80, easing: 'ease-in-out' }));
    });
    for (let i = 0; i < 8; i++) { burst(40 + Math.random() * 280, 150 + Math.random() * 280, CONFETTI, 14, 80); await wait(300); }
    await wait(800);
    showEnd(T.clear);
  }

  function reset() {
    step = 0;
    if (!DATA.orders) ORDERS = makeOrders();
    $('board').querySelectorAll('.sticker').forEach(n => n.remove());
    const party = $('party'); if (party) party.remove();
    show('endScreen', false); show('setScreen', false);
    nextCustomer();
  }

  /* ---------------- はじめる ---------------- */
  $('titleText').textContent = T.title;
  $('subText').textContent = T.sub;
  $('startText').textContent = T.start;
  $('clearText').textContent = T.clear;
  $('againText').textContent = T.again;
  $('contText').textContent = T.cont;
  $('stopText').textContent = T.stop;
  drawGhost($('titleGhost'), DATA.shopkeeper, 'smile');
  buildBoard();

  $('titleScreen').addEventListener('pointerdown', async () => {
    if (state !== 'title') return;
    state = 'starting';
    audio(); SFX.pop();
    await anim($('titleScreen'), [{ opacity: 1 }, { opacity: 0 }], { duration: 400 });
    show('titleScreen', false);
    nextCustomer();
  });
  svg.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  $('contBtn').addEventListener('pointerdown', () => {
    if (state !== 'set') return;
    state = 'busy'; SFX.pop();
    show('setScreen', false);
    nextCustomer();
  });
  $('stopBtn').addEventListener('pointerdown', () => {
    if (state !== 'set') return;
    SFX.pop();
    show('setScreen', false);
    showEnd(T.bye);
  });
  $('endScreen').addEventListener('pointerdown', () => { if (state === 'end') { SFX.pop(); reset(); } });

  // 自動テスト用
  window.__game = {
    get state() { return state; }, get step() { return step; }, get si() { return si; },
    get stepInfo() { return bread && bread.steps[si]; }, get bread() { return bread && bread.id; },
    get total() { return ORDERS.length; }, places: P,
    get guides() { return work.guides ? work.guides.map(g => g.pts.map(toS)) : null; },
    get guideIndex() { return work.gi; }, oven: OV, get orders() { return ORDERS; }, get rushCount() { return work.count; }, get rushLv() { return work.lv; }, miniGallery() { const g = el('g', { id: 'gal' }, svg); el('rect', { x: -400, y: -200, width: 1160, height: 1040, fill: '#43295F' }, g);
      DATA.rush.levels.forEach((t, lv) => { const w = el('g', { transform: `translate(${60 + (lv % 3) * 120},${110 + ((lv / 3) | 0) * 160}) scale(.42)` }, g);
        drawMini(w, RUSH_POOL[lv % RUSH_POOL.length], lv);
        const tx = el('text', { x: 0, y: 150, 'text-anchor': 'middle', 'font-size': 40, fill: '#FFE7B8' }, w); tx.textContent = t + 'こ'; }); }, gallery(mood) { const g = el('g', { id: 'gal' }, svg); el('rect', { x: -400, y: -200, width: 1160, height: 1040, fill: '#43295F' }, g); ALL_CUSTOMERS.forEach((c, i) => { const w = el('g', { transform: `translate(${60 + (i % 4) * 80},${80 + Math.floor(i / 4) * 140})` }, g); drawCustomer(el('g', { transform: `scale(${0.75 * (c.size || 1)})` }, w), c, mood); makeSticker(el('g', { transform: 'translate(0,70)' }, w), c); }); }, get best() { return rushBest; },
    spot(i) { const s = bread.steps[si]; return toS({ x: s.spots[i][0], y: s.spots[i][1] }); }
  };
})();
</script>
</body>
</html>
