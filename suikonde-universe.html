<title>すいこんで ユニバース！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ポップな積み木の居間。3Dキャンバスを画面いっぱいに置き、丸いシール風のHUDをのせる */
:root{
  --ink:#3b2f4a;
  --paper:#fff8ec;
  --pink:#ff5fa2;
  --pink-deep:#d93f82;
  --sun:#ffd23f;
  --sky:#5ec8f2;
  --grass:#7ed36d;
  --font-pop:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:"Kiwi Maru","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
body{background:#fbe6c8;color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;align-items:flex-start;gap:8px;pointer-events:none}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink)}
.pow{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;min-width:0;flex:0 1 300px}
.lv{font-family:var(--font-pop);font-size:20px;line-height:1;background:var(--pink);color:#fff;border-radius:12px;padding:5px 8px 6px;white-space:nowrap}
.bar{flex:1;min-width:60px;height:16px;border-radius:99px;background:#eadfcf;border:2px solid var(--ink);overflow:hidden}
#powfill{height:100%;width:0;background:repeating-linear-gradient(-45deg,#ffd23f 0 10px,#ffbf1f 10px 20px);transition:width .2s}
.bat{margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 10px}
.batbody{position:relative;width:62px;height:24px;border:3px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}
.batbody::after{content:"";position:absolute;right:-9px;top:5px;width:5px;height:9px;background:var(--ink);border-radius:0 3px 3px 0}

#batfill.low{background:#ff6b5f;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}

.chip[aria-pressed="false"]{color:#a99}

.lg{font-family:var(--font-body);font-size:20px;background:rgba(255,248,236,.92);border:2px solid var(--ink);border-radius:99px;padding:3px 14px;animation:lgin .25s cubic-bezier(.3,1.6,.5,1),lgout .4s ease-in 1.4s forwards;white-space:nowrap}
.lg b{font-family:var(--font-pop);font-weight:400;color:var(--pink)}
.lg.friend{background:var(--sun)}
.lg.no{background:#e8e2f0}

@keyframes lgout{to{opacity:0;transform:translateY(-10px)}}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-family:var(--font-pop);font-size:clamp(34px,9vw,72px);color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);line-height:1.15}
#banner.show{animation:ban 2.2s cubic-bezier(.3,1.5,.5,1) forwards}
#banner small{display:block;font-size:.45em;color:#fff;margin-top:6px}
@keyframes ban{0%{transform:scale(.2) rotate(-8deg);opacity:0}15%{transform:scale(1.08) rotate(2deg);opacity:1}25%{transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid rgba(59,47,74,.35);background:rgba(255,255,255,.25);pointer-events:none}

.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tcard{text-align:center;pointer-events:auto}
.tcard h1{font-family:var(--font-pop);font-weight:400;font-size:clamp(46px,12vw,104px);line-height:1.05;margin:0;color:var(--pink);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);transform:rotate(-4deg)}
.tcard h1 span{color:var(--sun)}
.tcard p{font-size:20px;margin:18px 0 18px;background:rgba(255,248,236,.9);display:inline-block;padding:6px 16px;border-radius:99px;border:2px solid var(--ink)}
.big{font-family:var(--font-pop);font-size:30px;padding:12px 46px 14px;border-radius:99px;border:4px solid var(--ink);background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;letter-spacing:.06em}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#result{align-items:flex-end}
.rcard{pointer-events:auto;background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);width:100%;max-width:640px;max-height:72vh;display:flex;flex-direction:column;overflow:hidden;animation:lgin .4s cubic-bezier(.3,1.5,.5,1)}
.rhead{font-family:var(--font-pop);font-size:26px;text-align:center;padding:10px 12px 6px;background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink)}
.rbody{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.tile{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:4px 4px 6px;text-align:center;animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.tile img{width:64px;height:64px;display:block;margin:0 auto}
.tile .nm{font-size:13px;line-height:1.2;min-height:1.2em}
.tile .ct{font-family:var(--font-pop);font-size:20px;color:var(--pink-deep);font-variant-numeric:tabular-nums}
@keyframes pop{from{transform:scale(.2)}to{transform:none}}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:18px;animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.sum dt{background:var(--sky);color:#fff;font-family:var(--font-pop);font-size:15px;border-radius:99px;padding:3px 10px;text-align:center;-webkit-text-stroke:.5px var(--ink)}
.sum dd{margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sum dd img{width:40px;height:40px}
.shogo{font-family:var(--font-pop);font-size:clamp(24px,6vw,34px);text-align:center;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.ract{display:flex;justify-content:center;padding:4px 0 6px}
.keyc{align-self:center;font-family:var(--font-pop);font-size:15px;background:linear-gradient(#ffe680,#ffc21f);border:3px solid var(--ink);border-radius:99px;padding:5px 10px;box-shadow:0 3px 0 var(--ink);animation:lgin .4s cubic-bezier(.3,1.7,.5,1)}
.btnrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}
.chip2{font-family:var(--font-body);font-size:18px;padding:10px 18px;border-radius:99px;border:3px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.big.pink{background:var(--pink);color:#fff}
.score{display:flex;justify-content:center;align-items:baseline;gap:8px;font-size:18px;animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
.score b{font-family:var(--font-pop);font-weight:400;font-size:38px;color:var(--pink-deep);font-variant-numeric:tabular-nums}
.spins{text-align:center;font-size:17px;animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
.spins .cap{display:inline-block;width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);background:linear-gradient(var(--pink) 50%,#fff 50%);margin:0 3px;vertical-align:middle}
.spins .cap.off{background:#e8e2f0;opacity:.5}
.hint{text-align:center;font-size:16px;background:#fff6c8;border:2px dashed var(--ink);border-radius:14px;padding:8px 10px}
#gui{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.gcard{pointer-events:auto;background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:12px 20px 16px;text-align:center;max-width:420px;width:100%;animation:lgin .35s cubic-bezier(.3,1.6,.5,1)}
.gcard .rar{display:inline-block;font-family:var(--font-pop);font-size:16px;border:2px solid var(--ink);border-radius:99px;padding:2px 12px;margin-bottom:4px}
.rar.UP{background:#9fe08a}.upst{text-align:center;font-size:17px;line-height:1.6;background:#effbe6;border:2px solid var(--ink);border-radius:14px;padding:6px 10px}.upst b{color:#e8a400;letter-spacing:.05em}.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.rbtns .big{font-size:22px;padding:10px 22px 12px;line-height:1.15}.rbtns .big small{display:block;font-family:var(--font-body);font-size:14px;letter-spacing:0}
.rar.N{background:#bfe9fb}.rar.R{background:#ffb3d1}.rar.SR{background:linear-gradient(90deg,#ffe680,#ffb3d1,#bfe9fb);}
.gcard h3{font-family:var(--font-pop);font-weight:400;font-size:clamp(26px,7vw,36px);margin:2px 0 4px;color:var(--pink);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.gcard p{margin:0 0 10px;font-size:16px}
#gleft{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);font-family:var(--font-pop);font-size:18px;background:var(--paper);border:3px solid var(--ink);border-radius:99px;padding:6px 14px;box-shadow:0 3px 0 var(--ink)}
#coll .rcard{max-height:84vh}
.tile.no{background:#efe9f6;color:#a99}.tile.no .q{font-family:var(--font-pop);font-size:38px;line-height:64px;height:64px}
.tile.new{box-shadow:0 0 0 4px var(--sun)}
.tile .rr{font-size:11px;font-family:var(--font-pop);border-radius:99px;border:1.5px solid var(--ink);padding:0 6px;display:inline-block}
.tile .rr.N{background:#bfe9fb}.tile .rr.R{background:#ffb3d1}.tile .rr.SR{background:#ffe680}
.tbtns{display:flex;flex-direction:column;align-items:center;gap:9px}
.tbtns .big{min-width:250px;line-height:1.15;font-size:24px;padding:8px 30px 10px}.tbtns .big small{display:block;font-family:var(--font-body);font-size:15px;letter-spacing:0}
@media (prefers-reduced-motion:reduce){#banner.show,.lg,.tile,.sum,.shogo,.rcard{animation-duration:.01s}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var TAU=Math.PI*2;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ============ レンダラー ============ */
var cv=document.getElementById('cv');

}

/* ============ もの のカタログ（1 = 10cm） ============ */
var DEFS={
  dust:{name:'ほこり',b:function(){return[part(Sp(.09,6,4),'#bdb6ad',[0,.07,0],0,[1,.8,1]),part(Sp(.06,6,4),'#cfc9c0',[.06,.06,.03]),part(Sp(.05,6,4),'#a8a198',[-.05,.05,-.04])];}},

  peel:{name:'みかんのかわ',b:function(){return[part(Bx(.22,.04,.15),'#f39a2b',[0,.03,0],[.2,.3,0]),part(Bx(.18,.04,.13),'#f6a63c',[.15,.04,.08],[-.2,1,0]),part(Bx(.16,.04,.12),'#f39a2b',[-.12,.03,.1],[.1,-.6,.2])];}},
  button:{name:'ボタン',v:['#ff8fb8','#7cc7f0','#ffd23f'],b:function(c){return[part(Cy(.1,.1,.04,10),c,[0,.02,0]),part(Cy(.02,.02,.045,5),'#ffffff',[.035,.022,0]),part(Cy(.02,.02,.045,5),'#ffffff',[-.035,.022,0])];}},
  marble:{name:'ビーだま',b:function(){return[part(Sp(.085,8,6),'#8fd3ec',[0,.085,0]),part(Sp(.035,6,4),'#ffffff',[.03,.12,.04])];}},
  coin:{name:'10えんだま',b:function(){return[part(Cy(.12,.12,.03,12),'#c77d3e',[0,.015,0]),part(Cy(.06,.06,.032,8),'#b56c33',[0,.016,0])];}},
  rubber:{name:'わゴム',v:['#f0a33d','#ec6a6a','#7bbf6a'],b:function(c){return[part(To(.14,.02,4,12),c,[0,.02,0],[Math.PI/2,0,0])];}},
  pick:{name:'つまようじ',b:function(){return[part(Cy(.014,.014,.62,5),'#ecd6a2',[0,.015,0],[0,0,Math.PI/2])];}},
  batt:{name:'でんち',b:function(){return[part(Cy(.09,.09,.32,10),'#f5c63a',[.05,.09,0],[0,0,Math.PI/2]),part(Cy(.091,.091,.14,10),'#2f2f36',[-.17,.09,0],[0,0,Math.PI/2]),part(Cy(.035,.035,.05,6),'#d9dde3',[.235,.09,0],[0,0,Math.PI/2])];}},
  eraser:{name:'けしゴム',b:function(){return[part(Bx(.9,.34,.46),'#fbfbf6',[0,.17,0]),part(Bx(.5,.36,.48),'#4a86d6',[.14,.17,0]),part(Bx(.2,.37,.49),'#ffffff',[.14,.17,0])];}},
